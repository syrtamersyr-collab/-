<script type="module">
// «حمص المصغّرة» — real-time 3D diorama reel for Makkah Technologies. 1080x1920, 36s.
// Every frame is a pure function of t: window.render(t).
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1080, H = 1920, DUR = 36;
const NAVY = 0x02376C, GREEN = 0x50BE1E;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eout = p => 1 - Math.pow(1 - p, 3);
const smooth = p => p * p * (3 - 2 * p);
const eback = p => { const c1 = 1.7, c3 = c1 + 1; return Math.max(0, 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2)); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20);

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
const pmrem = new THREE.PMREMGenerator(renderer);
const ENV = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; }
function skyTex(stops) { return canvasTex(16, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); stops.forEach(([o, c]) => gr.addColorStop(o, c)); g.fillStyle = gr; g.fillRect(0, 0, w, h); }); }

// =====================================================================
//  CITY SCENE
// =====================================================================
const city = new THREE.Scene();
city.background = skyTex([[0, '#020916'], [.45, '#06224a'], [.72, '#1b4a78'], [.86, '#c9784a'], [1, '#2a1a2a']]);
city.fog = new THREE.Fog(0x0a2244, 55, 150);
city.environment = ENV; city.environmentIntensity = 0.12;
const cam = new THREE.PerspectiveCamera(50, W / H, 0.1, 400);

city.add(new THREE.HemisphereLight(0x5f8fd6, 0x1a1420, 0.55));
const sun = new THREE.DirectionalLight(0xffb37a, 1.9); sun.position.set(-38, 26, 30); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 1, far: 120 }); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
city.add(sun);
const fill = new THREE.DirectionalLight(0x5aa0ff, 0.35); fill.position.set(30, 20, -20); city.add(fill);

const HDR = (hex, k = 3) => { const m = new THREE.MeshBasicMaterial({ color: hex, toneMapped: false }); m.color.multiplyScalar(k); return m; };
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, metalness: 0, ...o });
function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = city) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; }
function cyl(rt, rb, h, mat, x = 0, y = 0, z = 0, parent = city, segs = 20) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, segs), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; }

// ---- island ----
const IS = 46;
box(IS, 3, IS, M(0x0b2748, { roughness: .6 }), 0, -1.5, 0);
box(IS + .5, .35, IS + .5, HDR(0x66ff3a, 2.2), 0, -1.0, 0).castShadow = false;
box(IS - 3, 1.6, IS - 3, M(0x061a33), 0, -3.8, 0); box(IS - 9, 1.6, IS - 9, M(0x04142a), 0, -5.4, 0);
const road = box(IS - .4, .1, IS - .4, M(0x1b2433, { roughness: .95 }), 0, 0.05, 0); road.castShadow = false;
const PITCH = 8.6, LOT = 6.4, cell = i => i * PITCH;
const lotMat = M(0x364356, { roughness: .9 });
const dashMat = new THREE.MeshBasicMaterial({ color: 0xcfd6df });
for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) { const l = box(LOT + .9, .16, LOT + .9, lotMat, cell(i), .16, cell(j)); l.castShadow = false; }
for (let k = -2; k <= 1; k++) for (let s = -21; s <= 21; s += 2.4) { const a = cell(k) + PITCH / 2; let d = box(.9, .02, .12, dashMat, s, .115, a); d.castShadow = false; d = box(.12, .02, .9, dashMat, a, .115, s); d.castShadow = false; }

// ---- textures for façades ----
const WALLS = ['#d8c9ad', '#cdbb9b', '#e2d6bf', '#bfae90', '#c9c2b4', '#d4b998'];
function facade(color, cols, rows, seed) {
  const r = rng(seed); const cells = []; for (let i = 0; i < cols * rows; i++) cells.push(r());
  const map = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = color; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 16) { g.fillStyle = `rgba(0,0,0,${.03 + .03 * ((y / 16) % 2)})`; g.fillRect(0, y, w, 8); }   // ablaq-style banding
    const cw = w / cols, ch = h / rows;
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) { g.fillStyle = '#1c2836'; g.fillRect(i * cw + cw * .22, j * ch + ch * .22, cw * .56, ch * .56); g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(i * cw + cw * .18, j * ch + ch * .8, cw * .64, ch * .06); }
  });
  const emis = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h); const cw = w / cols, ch = h / rows;
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) { const v = cells[i * rows + j]; if (v < .22) continue; g.fillStyle = v > .8 ? '#bfe0ff' : (v > .5 ? '#ffc777' : '#ffdca0'); g.fillRect(i * cw + cw * .22, j * ch + ch * .22, cw * .56, ch * .56); }
  });
  return { map, emis };
}

// ---- LiteBeam-style antenna ----
const white = M(0xf2f5f8, { roughness: .35 }), grey = M(0x8fa0b3, { roughness: .5, metalness: .6 });
function liteBeam(s = 1) {
  const g = new THREE.Group();
  const head = new THREE.Group(); g.add(head); head.position.y = 1.5 * s;
  const panel = new THREE.Mesh(new THREE.CylinderGeometry(2.4 * s, 2.4 * s, 1.15 * s, 40, 1, true, -0.38, 0.76), new THREE.MeshStandardMaterial({ color: 0xf4f6f9, roughness: .4, side: THREE.DoubleSide }));
  panel.position.z = -2.25 * s; panel.castShadow = true; head.add(panel);
  // perforation hint
  const dots = canvasTex(256, 128, (c, w, h) => { c.fillStyle = '#f4f6f9'; c.fillRect(0, 0, w, h); c.fillStyle = '#b9c4d0'; for (let x = 6; x < w; x += 10) for (let y = 6; y < h; y += 10) if (Math.abs(x - w / 2) > 30) { c.beginPath(); c.arc(x, y, 1.8, 0, 7); c.fill(); } });
  panel.material.map = dots;
  box(.42 * s, 1.2 * s, .1 * s, white, 0, 0, .17 * s, head);
  const arm = cyl(.07 * s, .09 * s, .85 * s, white, 0, 0, .6 * s, head, 12); arm.rotation.x = Math.PI / 2;
  box(.2 * s, .24 * s, .3 * s, white, 0, 0, 1.08 * s, head);
  const led = new THREE.Mesh(new THREE.SphereGeometry(.045 * s, 12, 12), HDR(0x7dff4a, 2)); led.position.set(0, .14 * s, 1.1 * s); head.add(led);
  box(.16 * s, .3 * s, .2 * s, grey, 0, 0, -.02 * s, head);
  cyl(.045 * s, .045 * s, 1.9 * s, grey, 0, .75 * s, -.1 * s, g, 10);
  g.userData = { head, led, feed: new THREE.Vector3(0, 1.5 * s, 1.1 * s) };
  return g;
}

// ---- buildings ----
const BLD = []; const TOWER_TOP = new THREE.Vector3(0, 17.2, 0);
const roofMat = M(0x6b6f76, { roughness: .95 }), tankMat = M(0xdfe5ec, { roughness: .5 }), tankCap = M(0x33506f);
function building(x, z, w, d, h, seed, opts = {}) {
  const f = facade(WALLS[seed % WALLS.length], Math.max(2, Math.round(w / 1.5)), Math.max(2, Math.round(h / 1.5)), seed);
  const side = new THREE.MeshStandardMaterial({ map: f.map, emissiveMap: f.emis, emissive: 0xffffff, emissiveIntensity: .06, roughness: .85 });
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [side, side, roofMat, roofMat, side, side]);
  b.position.set(x, h / 2 + .24, z); b.castShadow = b.receiveShadow = true; city.add(b);
  const top = h + .24;
  for (const [px, pz, pw, pd] of [[0, d / 2 - .1, w, .2], [0, -d / 2 + .1, w, .2], [w / 2 - .1, 0, .2, d], [-w / 2 + .1, 0, .2, d]]) box(pw, .4, pd, side, x + px, top + .2, z + pz);
  const rec = { x, z, w, d, h, top, side, litAt: 99 };
  if (!opts.bare) {
    for (let k = 0; k < 1 + (seed % 2); k++) { const tx = x - w * .25 + k * .9, tz = z - d * .22; cyl(.38, .38, .75, tankMat, tx, top + .65, tz); cyl(.4, .4, .08, tankCap, tx, top + 1.06, tz); box(.6, .28, .6, grey, tx, top + .14, tz); }
    const a = liteBeam(opts.hero ? 1.25 : .5); a.position.set(x + w * .22, top, z + d * .2); city.add(a);
    a.userData.head.lookAt(TOWER_TOP.x, a.position.y + 1.5 * (opts.hero ? 1.25 : .5) + (TOWER_TOP.y - top) * .12, TOWER_TOP.z);
    a.updateMatrixWorld(true); rec.ant = a; rec.feed = a.userData.head.localToWorld(new THREE.Vector3(0, 0, 1.1 * (opts.hero ? 1.25 : .5)));
  }
  BLD.push(rec); return rec;
}
const HERO = [2, 2], SOLAR = [-1, 1], MOSQUE = [-2, -1], CLOCK = [1, -2];
let heroB, solarB;
for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
  if (i === 0 && j === 0) continue;
  if (i === MOSQUE[0] && j === MOSQUE[1]) continue;
  if (i === CLOCK[0] && j === CLOCK[1]) continue;
  if (i === 0 && j === 1) continue;   // plaza in front of the shop
  const seed = (i + 3) * 7 + (j + 3) * 13;
  if (i === HERO[0] && j === HERO[1]) { heroB = building(cell(i), cell(j), 5.6, 5.6, 5.2, seed, { hero: true }); continue; }
  if (i === SOLAR[0] && j === SOLAR[1]) { solarB = building(cell(i), cell(j), 6.0, 5.6, 3.8, seed, { bare: true }); continue; }
  const h = 3.2 + R() * 5.2 + (Math.abs(i) + Math.abs(j) < 2 ? 0 : 0);
  building(cell(i) + (R() - .5) * .5, cell(j) + (R() - .5) * .5, 4.4 + R() * 1.6, 4.4 + R() * 1.6, h, seed);
}

// ---- Makkah shop + tower (centre) ----
const shopSide = M(0xf3f6fa, { roughness: .6 });
const shop = box(6.4, 4.6, 6.0, shopSide, 0, 2.3 + .24, 0);
box(6.6, .35, 6.2, M(NAVY, { roughness: .5 }), 0, 4.84 + .18, 0);
const signTex = canvasTex(1024, 256, (g, w, h) => { g.fillStyle = '#02376C'; g.fillRect(0, 0, w, h); g.fillStyle = '#50BE1E'; g.fillRect(0, h - 22, w, 22); });
const sign = new THREE.Mesh(new THREE.PlaneGeometry(6.0, 1.5), new THREE.MeshStandardMaterial({ map: signTex, emissiveMap: signTex, emissive: 0xffffff, emissiveIntensity: .42, roughness: .5 }));
sign.position.set(0, 3.75, 3.02); city.add(sign);
const awn = box(6.2, .14, 1.1, M(GREEN, { roughness: .6 }), 0, 2.85, 3.5); awn.rotation.x = .28;
const glass = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 2.2), new THREE.MeshStandardMaterial({ color: 0x9fd0ff, emissive: 0xffd9a0, emissiveIntensity: .32, roughness: .2 })); glass.position.set(0, 1.5, 3.02); city.add(glass);
for (const sx of [-1.3, 0, 1.3]) box(.08, 2.2, .06, M(NAVY), sx, 1.5, 3.05);
// tower
const steel = M(0xdfe6ee, { roughness: .4, metalness: .7 });
const tw = new THREE.Group(); tw.position.set(0, 5.2, 0); city.add(tw);
for (const [sx, sz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) { const leg = cyl(.07, .09, 12.2, steel, 0, 0, 0, tw, 8); leg.position.set(sx * .5, 6, sz * .5); leg.rotation.z = -sx * .058; leg.rotation.x = sz * .058; }
for (let k = 0; k < 9; k++) { const y = .6 + k * 1.35, s = lerp(.86, .18, k / 9); const ring = new THREE.Mesh(new THREE.TorusGeometry(s * 1.2, .035, 6, 4), steel); ring.rotation.x = Math.PI / 2; ring.rotation.z = Math.PI / 4; ring.position.y = y; ring.castShadow = true; tw.add(ring); }
for (let k = 0; k < 3; k++) { const a = k * Math.PI * 2 / 3 + .5; const p = box(.34, 1.3, .12, white, Math.cos(a) * .55, 10.2, Math.sin(a) * .55, tw); p.rotation.y = -a + Math.PI / 2; }
const beacon = new THREE.Mesh(new THREE.SphereGeometry(.3, 24, 24), HDR(0x8dff5a, 4)); beacon.position.copy(TOWER_TOP); city.add(beacon);
const beaconL = new THREE.PointLight(0x66ff33, 60, 40, 1.8); beaconL.position.copy(TOWER_TOP); city.add(beaconL);
const RINGS = []; for (let k = 0; k < 3; k++) { const r = new THREE.Mesh(new THREE.TorusGeometry(1, .03, 8, 64), new THREE.MeshBasicMaterial({ color: 0x7dff4a, transparent: true, toneMapped: false })); r.rotation.x = Math.PI / 2; r.position.copy(TOWER_TOP); city.add(r); RINGS.push(r); }

// ---- CCTV on the shop ----
const cctv = new THREE.Group(); cctv.position.set(3.0, 3.3, 3.25); city.add(cctv);
box(.18, .18, .5, white, 0, 0, -.1, cctv);
const cctvHead = new THREE.Group(); cctvHead.position.set(0, -.1, .25); cctv.add(cctvHead);
const body = cyl(.16, .16, .7, white, 0, 0, .3, cctvHead, 20); body.rotation.x = Math.PI / 2;
const lens = cyl(.11, .11, .06, M(0x0b1b30, { roughness: .1, metalness: .8 }), 0, 0, .67, cctvHead, 20); lens.rotation.x = Math.PI / 2;
const cone = new THREE.Mesh(new THREE.ConeGeometry(2.6, 8, 40, 1, true), new THREE.MeshBasicMaterial({ color: 0x66ff3a, transparent: true, opacity: .13, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));
cone.rotation.x = -Math.PI / 2; cone.position.z = 4.7; cctvHead.add(cone);
const scanSpot = new THREE.SpotLight(0x66ff3a, 0, 14, .32, .5, 1.2); scanSpot.position.set(0, 0, .7); cctvHead.add(scanSpot); scanSpot.target.position.set(0, 0, 8); cctvHead.add(scanSpot.target);
const recDot = new THREE.Mesh(new THREE.SphereGeometry(.035, 10, 10), HDR(0xff3b3b, 4)); recDot.position.set(.1, .1, .64); cctvHead.add(recDot);

// ---- solar roof + AC ----
const pvTex = canvasTex(256, 160, (g, w, h) => { g.fillStyle = '#0c2f66'; g.fillRect(0, 0, w, h); g.strokeStyle = '#7fb0ee'; g.lineWidth = 3; for (let x = 0; x <= w; x += 32) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); } for (let y = 0; y <= h; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); } });
const pvMat = new THREE.MeshStandardMaterial({ map: pvTex, roughness: .12, metalness: .75, envMapIntensity: 3 });
const PV = [];
for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) {
  const g = new THREE.Group(); g.position.set(solarB.x - 1.75 + c * 1.75, solarB.top + .55, solarB.z - 1.2 + r * 1.9); city.add(g);
  const p = box(1.6, .06, 1.0, [white, white, pvMat, white, white, white], 0, 0, 0, g); g.rotation.x = .5; PV.push(p);
  box(.06, .5, .06, grey, solarB.x - 1.75 + c * 1.75, solarB.top + .25, solarB.z - 1.55 + r * 1.9);
}
const ac = new THREE.Group(); ac.position.set(solarB.x + 2.2, solarB.top + .45, solarB.z + 2.0); city.add(ac);
box(1.3, .85, .55, white, 0, 0, 0, ac);
const fanRing = cyl(.34, .34, .04, M(0x26323f), -.2, 0, .29, ac, 28); fanRing.rotation.x = Math.PI / 2;
const fan = new THREE.Group(); fan.position.set(-.2, 0, .32); ac.add(fan);
for (let k = 0; k < 4; k++) { const bl = box(.09, .3, .02, M(0xaab6c4), 0, .15, 0, fan); const pv = new THREE.Group(); pv.rotation.z = k * Math.PI / 2; fan.remove(bl); pv.add(bl); fan.add(pv); }
for (let k = 0; k < 4; k++) box(.36, .04, .02, M(0x7e8c9b), .38, -.25 + k * .16, .285, ac);

// ---- Homs landmarks ----
const stone = M(0xe6dcc6, { roughness: .8 }), basalt = M(0x3a3d44, { roughness: .8 }), domeMat = M(0xbfc7cf, { roughness: .3, metalness: .7 });
{ const x = cell(MOSQUE[0]), z = cell(MOSQUE[1]);
  box(6.2, 2.6, 5.4, stone, x, 1.54, z); for (let k = 0; k < 3; k++) box(6.24, .22, 5.44, basalt, x, .7 + k * .8, z);
  const dome = (dx, dz, r) => { const d = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 20, 0, Math.PI * 2, 0, Math.PI / 2), domeMat); d.position.set(x + dx, 2.84, z + dz); d.castShadow = true; city.add(d); cyl(.03, .03, .5, domeMat, x + dx, 2.84 + r + .2, z + dz, city, 8); };
  dome(0, 0, 1.7); dome(-2.1, 1.6, .8); dome(2.1, 1.6, .8); dome(-2.1, -1.6, .8); dome(2.1, -1.6, .8);
  for (const sx of [-1, 1]) { cyl(.3, .36, 8.5, stone, x + sx * 3.3, 4.5, z + 2.5, city, 16); cyl(.46, .46, .2, stone, x + sx * 3.3, 7.2, z + 2.5, city, 16); const c = new THREE.Mesh(new THREE.ConeGeometry(.34, 1.5, 16), M(0x4a5560, { metalness: .5, roughness: .4 })); c.position.set(x + sx * 3.3, 9.5, z + 2.5); c.castShadow = true; city.add(c); for (let k = 0; k < 6; k++) cyl(.31, .31, .18, basalt, x + sx * 3.3, 1 + k * 1.1, z + 2.5, city, 16); }
}
const clockTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#e6dcc6'; g.fillRect(0, 0, w, h); g.fillStyle = '#fff8e2'; g.beginPath(); g.arc(128, 128, 100, 0, 7); g.fill(); g.strokeStyle = '#2a2a2a'; g.lineWidth = 8; g.stroke(); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; g.beginPath(); g.moveTo(128 + Math.cos(a) * 80, 128 + Math.sin(a) * 80); g.lineTo(128 + Math.cos(a) * 94, 128 + Math.sin(a) * 94); g.stroke(); } g.lineWidth = 10; g.beginPath(); g.moveTo(128, 128); g.lineTo(128 + 50, 128 - 30); g.moveTo(128, 128); g.lineTo(128 - 10, 128 - 76); g.stroke(); });
{ const x = cell(CLOCK[0]), z = cell(CLOCK[1]); box(2.2, 8.5, 2.2, stone, x, 4.5, z); for (let k = 0; k < 5; k++) box(2.24, .2, 2.24, basalt, x, 1 + k * 1.3, z);
  const cm = new THREE.MeshStandardMaterial({ map: clockTex, emissiveMap: clockTex, emissive: 0xffffff, emissiveIntensity: .4 });
  box(2.6, 2.4, 2.6, [cm, cm, stone, stone, cm, cm], x, 9.95, z); const cap = new THREE.Mesh(new THREE.ConeGeometry(1.9, 1.5, 4), basalt); cap.rotation.y = Math.PI / 4; cap.position.set(x, 11.9, z); cap.castShadow = true; city.add(cap); }

// ---- plaza ----
{ const pz = cell(1); const pl = box(LOT + .9, .1, LOT + .9, M(0x4a5b6e, { roughness: .9 }), 0, .3, pz); pl.castShadow = false;
  const ringm = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, .25, 40), M(0xdfe5ec)); ringm.position.set(0, .45, pz); ringm.castShadow = ringm.receiveShadow = true; city.add(ringm);
  const water = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, .27, 40), new THREE.MeshStandardMaterial({ color: 0x2b7fbf, roughness: .08, metalness: .6 })); water.position.set(0, .46, pz); city.add(water);

const LAMPS = [];
for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {

const CARS = [];

// ---- stars ----
{ const n = 500, pos = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const a = R() * 6.283, e = .15 + R() * 1.2, r = 180; pos[i * 3] = Math.cos(a) * Math.cos(e) * r; pos[i * 3 + 1] = Math.sin(e) * r; pos[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r; }

// ---- signal beams tower → rooftops ----
const beamMat = HDR(0x78ff46, 1.9);
const BEAMS = [];
BLD.filter(b => b.feed).sort((a, b) => Math.hypot(a.x, a.z) - Math.hypot(b.x, b.z)).forEach((b, i) => {
  const mid = TOWER_TOP.clone().add(b.feed).multiplyScalar(.5); mid.y += 4 + Math.hypot(b.x, b.z) * .22;

const HEROA = new THREE.Vector3(heroB.ant.position.x, heroB.top + 1.9, heroB.ant.position.z);

  { t: 4.0, p: orbit(4.0), l: HEROA.clone() },
  { t: 7.6, p: new THREE.Vector3(44, 27, 40), l: new THREE.Vector3(3, 6.5, 2) },

  { t: 24.0, p: new THREE.Vector3(-30, 30, 34), l: new THREE.Vector3(0, 5, 0) },

function camAt(t) {

}

  chip('تغطية', 300, t, 5.4, 10.4); words('تغطية بتوصل', W / 2, 400, 96, t, 5.6, 10.4); words('لحارتك', W / 2, 520, 120, t, 6.2, 10.4, { color: '#7BE04A' });
  chip('مراقبة', 300, t, 11.8, 15.6); words('كاميرات مراقبة', W / 2, 400, 96, t, 12.0, 15.6); words('ذكية بدقة عالية', W / 2, 520, 92, t, 12.6, 15.6, { color: '#7BE04A' });
  chip('طاقة', 300, t, 17.0, 20.6); words('طاقة شمسية', W / 2, 400, 100, t, 17.2, 20.6); words('وتكييف', W / 2, 520, 116, t, 17.8, 20.6, { color: '#7BE04A' });
  words('كل الحلول', W / 2, 380, 104, t, 22.2, 26.6); words('من مكان واحد', W / 2, 500, 104, t, 22.8, 26.6, { color: '#7BE04A' });

    words('حمص – القصور – خلف جامع حمود الناصر', W / 2, 1420, 42, t, 32.4, 99, { weight: 500, font: BODY });

  if (t > 35.5) { c.fillStyle = `rgba(1,6,15,${seg(t, 35.5, 36) * .7})`; c.fillRect(0, 0, W, H); }
}

}
