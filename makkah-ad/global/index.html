{ const n = 900, pos = new Float32Array(n * 3), r = rng(2); for (let i = 0; i < n; i++) { const a = r() * 6.283, e = Math.asin(r() * 2 - 1), d = 120 + r() * 80; pos.set([Math.cos(a) * Math.cos(e) * d, Math.sin(e) * d, Math.sin(a) * Math.cos(e) * d - 60], i * 3); }

const white = M(0xf6f8fa, { roughness: .32 }), steel = M(0xb7c2ce, { roughness: .3, metalness: .85 }), dark = M(0x0c1a2c, { roughness: .25, metalness: .5 });

function render(t) {
