<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>حماتي والنت</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// «حماتي والنت» — comedic sketch for مركز مكة للتقنيات, Homs. 1080x1920, 34s. render(t) draws one frame.
const W = 1080, H = 1920, DUR = 34;
const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
const FONT = '"Readex Pro","IBM Plex Sans Arabic",sans-serif';
const GREEN = '#50BE1E', NAVY = '#02376C', RED = '#E5484D', CREAM = '#FFF8EC';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eout = p => 1 - Math.pow(1 - p, 3);
const eback = p => { const c1 = 1.9, c3 = c1 + 1; return p <= 0 ? 0 : 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
function rr(x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function txt(s, x, y, size, col, weight = 700, align = 'center', dir = 'rtl') { ctx.font = `${weight} ${size}px ${FONT}`; ctx.direction = dir; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(s, x, y); }
const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
let S1, S2, S3, LOGO, BEAM;

// ---------- camera over a scene image ----------
// keys: [[t, cx, cy, zoom], ...] in image coordinates (images are 1080x1920)
function camAt(keys, t) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const a = keys[i - 1], b = keys[i], p = eio(seg(t, a[0], b[0])); return [lerp(a[1], b[1], p), lerp(a[2], b[2], p), lerp(a[3], b[3], p)]; }
  return keys[keys.length - 1].slice(1);
}
function withCam(c, fn, shake = 0, t = 0) {
  let [cx, cy, z] = c; const hw = W / 2 / z, hh = H / 2 / z;
  cx = clamp(cx, hw, W - hw); cy = clamp(cy, hh, H - hh);
  ctx.save(); ctx.translate(W / 2 + (shake ? (hash(Math.floor(t * 30)) - .5) * shake : 0), H / 2 + (shake ? (hash(Math.floor(t * 30) + 9) - .5) * shake : 0)); ctx.scale(z, z); ctx.translate(-cx, -cy); fn(); ctx.restore();
  return [cx, cy, z];
}
const toScreen = (c, x, y) => [W / 2 + (x - c[0]) * c[2], H / 2 + (y - c[1]) * c[2]];

// ---------- comic speech bubble ----------
function bubble(lines, x, y, tail, t, t0, t1, o = {}) {
  const pin = eback(seg(t, t0, t0 + .32)), pout = seg(t, t1 - .18, t1); if (pin <= 0 || pout >= 1) return;
  const s = pin * (1 - pout * .4), a = 1 - pout, size = o.size || 62, lh = size * 1.32;
  ctx.save(); ctx.globalAlpha = a; ctx.font = `700 ${size}px ${FONT}`; ctx.direction = 'rtl';
  const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + size * 1.3, h = lines.length * lh + size * .75;
  const shake = o.shout ? (hash(Math.floor(t * 24)) - .5) * 8 : 0;
  ctx.translate(x + shake, y); ctx.scale(s, s);
  const bg = o.bg || '#fff', fg = o.fg || NAVY;
  // tail
  ctx.fillStyle = bg; ctx.strokeStyle = o.stroke || NAVY; ctx.lineWidth = 7; ctx.lineJoin = 'round';
  const tx = (tail[0] - x) / s, ty = (tail[1] - y) / s, bx = clamp(tx * .35, -w / 2 + 50, w / 2 - 50), by = ty > 0 ? h / 2 - 6 : -h / 2 + 6;
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.beginPath(); ctx.moveTo(bx - 34, by); ctx.quadraticCurveTo(bx + (tx - bx) * .4, by + (ty - by) * .5, tx, ty); ctx.quadraticCurveTo(bx + (tx - bx) * .5, by + (ty - by) * .35, bx + 34, by); ctx.closePath(); ctx.fill();
  rr(-w / 2, -h / 2, w, h, 44); ctx.fill(); ctx.shadowColor = 'transparent';
  rr(-w / 2, -h / 2, w, h, 44); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx - 34, by); ctx.quadraticCurveTo(bx + (tx - bx) * .4, by + (ty - by) * .5, tx, ty); ctx.quadraticCurveTo(bx + (tx - bx) * .5, by + (ty - by) * .35, bx + 34, by); ctx.stroke();
  ctx.fillStyle = bg; ctx.fillRect(bx - 30, by - 12, 60, 18);
  // words appear one by one
  lines.forEach((l, i) => {
    const words = l.split(' '), shown = Math.ceil(words.length * clamp((t - t0 - .12 - i * .25) / .45));
    const full = ctx.measureText(l).width; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillStyle = fg;
    ctx.fillText(words.slice(0, Math.max(0, shown)).join(' '), full / 2, -h / 2 + size * .38 + lh * (i + .5) + 4);
  });
  ctx.restore();
}
// bottom caption pill
function caption(s, t, t0, t1, col = NAVY) {
  const p = eout(seg(t, t0, t0 + .35)), q = seg(t, t1 - .25, t1); if (p <= 0 || q >= 1) return;
  ctx.save(); ctx.globalAlpha = 1 - q; ctx.font = `700 54px ${FONT}`; ctx.direction = 'rtl';
  const w = ctx.measureText(s).width + 110, y = 1770 + (1 - p) * 60;
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 30; ctx.fillStyle = col; rr(W / 2 - w / 2, y - 52, w, 104, 52); ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.fillStyle = GREEN; rr(W / 2 + w / 2 - 34, y - 14, 14, 28, 7); ctx.fill(); rr(W / 2 - w / 2 + 20, y - 14, 14, 28, 7); ctx.fill();
  txt(s, W / 2, y + 2, 54, '#fff'); ctx.restore();
}
// logo badge, always top-right, never over text
function badge(a = 1, left = false) {
  if (a <= 0) return; const w = 132, h = w * LOGO.height / LOGO.width; ctx.save(); if (left) ctx.translate(-(W - w - 54) + 26, 0);
  ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 18; ctx.fillStyle = 'rgba(255,255,255,.96)'; rr(W - w - 54, 30, w + 28, h + 24, 22); ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.drawImage(LOGO, W - w - 40, 42, w, h); ctx.restore(); ctx.restore();
}
function stamp(s, x, y, t, t0, col = RED, rot = -.12, size = 86, t1 = 1e9) {
  const p = seg(t, t0, t0 + .22); if (p <= 0 || t > t1) return; const sc = lerp(2.4, 1, eout(p));
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc); ctx.globalAlpha = clamp(p * 2);
  ctx.font = `700 ${size}px ${FONT}`; ctx.direction = 'rtl'; const w = ctx.measureText(s).width + size * .9;
  ctx.strokeStyle = col; ctx.lineWidth = 10; rr(-w / 2, -size * .78, w, size * 1.56, 22); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.92)'; rr(-w / 2 + 9, -size * .78 + 9, w - 18, size * 1.56 - 18, 14); ctx.fill();
  txt(s, 0, 4, size, col); ctx.restore();
}
function speedLines(t, a, cx = W / 2, cy = H / 2) {
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineCap = 'round';
  for (let i = 0; i < 46; i++) { const ang = hash(i) * Math.PI * 2, r0 = 560 + hash(i + 3) * 260 + ((t * 2200 + i * 97) % 300), len = 120 + hash(i + 5) * 200; ctx.lineWidth = 3 + hash(i + 7) * 7; ctx.beginPath(); ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0); ctx.lineTo(cx + Math.cos(ang) * (r0 + len), cy + Math.sin(ang) * (r0 + len)); ctx.stroke(); }
  ctx.restore();
}
function heart(x, y, s, col) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, 18); ctx.bezierCurveTo(-40, -8, -22, -40, 0, -20); ctx.bezierCurveTo(22, -40, 40, -8, 0, 18); ctx.fill(); ctx.restore(); }
function sparkle(x, y, r, a) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#fff'; ctx.translate(x, y); ctx.beginPath(); for (let i = 0; i < 8; i++) { const rad = i % 2 ? r * .22 : r; const an = i * Math.PI / 4; ctx.lineTo(Math.cos(an) * rad, Math.sin(an) * rad); } ctx.fill(); ctx.restore(); }
function whip(t, T, dir = 1) { // white smear flash at a cut
  const p = 1 - Math.abs(t - T) / .16; if (p <= 0) return; ctx.save(); ctx.globalAlpha = p * .85; const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.translate((t - T) * dir * 5000, 0); ctx.fillRect(-W, 0, W * 3, H); ctx.restore();
}

// ---------- 0: title ----------
function title(t) {
  const g = ctx.createRadialGradient(W / 2, 760, 50, W / 2, 900, 1200); g.addColorStop(0, '#0b5aa6'); g.addColorStop(1, '#011a35'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .1; ctx.translate(W / 2, 880); ctx.rotate(t * .25); ctx.fillStyle = '#fff'; for (let i = 0; i < 16; i++) { ctx.rotate(Math.PI / 8); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-90, -1600); ctx.lineTo(90, -1600); ctx.fill(); } ctx.restore();
  const lp = eback(seg(t, .05, .45)), lw = 300, lh = lw * LOGO.height / LOGO.width;
  ctx.save(); ctx.translate(W / 2, 470); ctx.scale(lp, lp); ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 40; ctx.fillStyle = '#fff'; rr(-lw / 2 - 30, -lh / 2 - 26, lw + 60, lh + 52, 36); ctx.fill(); ctx.shadowColor = 'transparent'; ctx.drawImage(LOGO, -lw / 2, -lh / 2, lw, lh); ctx.restore();
  const p = eback(seg(t, .3, .7)); ctx.save(); ctx.translate(W / 2, 960); ctx.scale(p, p); ctx.rotate(-.04);
  ctx.font = `700 150px ${FONT}`; ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = 26; ctx.strokeStyle = NAVY; ctx.strokeText('حماتي والنت', 0, 0); ctx.fillStyle = '#fff'; ctx.fillText('حماتي والنت', 0, 0); ctx.restore();
  const q = eout(seg(t, .6, .9)); ctx.save(); ctx.globalAlpha = q; ctx.font = `700 50px ${FONT}`; ctx.direction = 'rtl'; const w = ctx.measureText('حكاية حمصية قصيرة').width + 80;
  ctx.fillStyle = GREEN; rr(W / 2 - w / 2, 1100 - 44 + (1 - q) * 30, w, 88, 44); ctx.fill(); txt('حكاية حمصية قصيرة', W / 2, 1102 + (1 - q) * 30, 50, '#fff'); ctx.restore();
}

// ---------- 1: the first call (S1) ----------
const K1 = [[1.4, 540, 960, 1.0], [3.5, 610, 1110, 1.22], [4.55, 610, 1110, 1.22], [4.8, 540, 600, 1.75], [6.9, 540, 600, 1.75], [7.2, 772, 640, 1.75], [8.6, 772, 640, 1.75], [8.9, 540, 600, 1.75], [10.6, 540, 640, 1.6]];
const FREEZE = 3.55;
function sceneCall(t) {
  const c = camAt(K1, t), shake = (t > FREEZE && t < FREEZE + .25) ? 16 : (t > 4.55 && t < 4.85 ? 24 : 0);
  const cc = withCam(c, () => {
    ctx.drawImage(S1, 0, 0);
    // laptop screen: frozen + glitch blocks
    if (t > FREEZE) {
      const sx = 300, sy = 948, sw = 680, sh = 386;
      ctx.save(); ctx.beginPath(); ctx.rect(sx, sy, sw, sh); ctx.clip();
      const k = Math.floor(t * 12);
      for (let i = 0; i < 9; i++) { const y = sy + hash(k * 13 + i) * sh, h = 8 + hash(k * 7 + i) * 34, dx = (hash(k * 3 + i) - .5) * 90; ctx.drawImage(S1, sx, y, sw, h, sx + dx, y, sw, h); }
      ctx.fillStyle = 'rgba(10,20,40,.38)'; ctx.fillRect(sx, sy, sw, sh);
      ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = 'rgba(255,0,60,.12)'; ctx.fillRect(sx + 6, sy, sw, sh); ctx.fillStyle = 'rgba(0,200,255,.12)'; ctx.fillRect(sx - 6, sy, sw, sh); ctx.globalCompositeOperation = 'source-over';
      // spinner
      ctx.translate(640, 1120); for (let i = 0; i < 12; i++) { ctx.globalAlpha = ((i + Math.floor(t * 12)) % 12) / 12; ctx.fillStyle = '#fff'; ctx.save(); ctx.rotate(i * Math.PI / 6); rr(-6, -66, 12, 32, 6); ctx.fill(); ctx.restore(); }
      ctx.restore();
    }
  }, shake, t);
  // freeze flash
  if (t > FREEZE && t < FREEZE + .12) { ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(0, 0, W, H); }
  bubble(['آآآ… آآآ…'], 300, 560, toScreen(cc, 560, 1040), t, 2.25, FREEZE + .05, { size: 70 });
  stamp('علّق النت!', W / 2, 1500, t, FREEZE + .15, RED, -.1, 92, 4.6);
  if (t > FREEZE + .1 && t < 4.55) { /* hold the stamp */ }
  // mother
  bubble(['لك هاد عريس', 'ولا صورة جواز سفر؟!'], 350, 400, [300, 640], t, 4.95, 6.95, { shout: 1, size: 66 });
  // bride
  bubble(['ماما… النت علّق،', 'مش هو!'], 330, 1230, [690, 1010], t, 7.3, 8.65, { size: 64 });
  // mother verdict
  bubble(['روح ركّب نت', 'من مركز مكة يا ابني!'], 350, 400, [300, 640], t, 9.0, 10.55, { size: 66 });
  caption('مكالمة التعارف مع أهل العروس', t, 1.6, 4.5);
  caption('الحماية مو مقتنعة…', t, 4.9, 8.6, RED);
}

// ---------- 2: the run (S3) ----------
function sceneRun(t) {
  const z = lerp(1.12, 1.0, eout(seg(t, 10.6, 12))), bob = Math.sin(t * 18) * 6;
  const c = [540, 960 + bob, z];
  withCam(c, () => ctx.drawImage(S3, 0, 0), 6, t);
  speedLines(t, .35 * (1 - seg(t, 15.8, 16.4)), 300, 900);
  bubble(['بدي نت… اليوم!'], 340, 1290, [300, 860], t, 11.3, 13.0, { shout: 1, size: 64 });
  bubble(['ولا يهمك…', 'التركيب اليوم!'], 740, 1330, [800, 860], t, 13.1, 14.8, { size: 64 });
  bubble(['اليوم اليوم؟!'], 340, 1290, [300, 860], t, 14.9, 16.35, { size: 64 });
  caption('العريس طار على مركز مكة!', t, 10.9, 16.3);
}

// ---------- 3: rooftop install (drawn) ----------
function sceneRoof(t) {
  const lt = t - 16.4;
  const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#4aa7ef'); sky.addColorStop(.62, '#bfe6ff'); sky.addColorStop(1, '#ffe7c2'); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // sun
  const sg = ctx.createRadialGradient(830, 330, 10, 830, 330, 260); sg.addColorStop(0, 'rgba(255,250,220,1)'); sg.addColorStop(.3, 'rgba(255,236,170,.8)'); sg.addColorStop(1, 'rgba(255,236,170,0)'); ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
  // clouds
  for (let i = 0; i < 4; i++) { const x = ((i * 330 + lt * 26) % 1400) - 200, y = 220 + i * 110; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.ellipse(x, y, 120, 40, 0, 0, 7); ctx.ellipse(x + 70, y - 22, 80, 44, 0, 0, 7); ctx.ellipse(x - 70, y - 8, 70, 32, 0, 0, 7); ctx.fill(); }
  // distant city rooftops with water tanks & dishes
  for (let layer = 0; layer < 2; layer++) {
    ctx.fillStyle = layer ? '#c9a77f' : '#dcc7a6';
    for (let i = 0; i < 14; i++) { const x = i * 90 - 30 + layer * 40, h = 120 + hash(i + layer * 20) * (layer ? 160 : 120), y = (layer ? 1260 : 1190) - h; ctx.fillRect(x, y, 92, h + 400); ctx.save(); ctx.fillStyle = layer ? 'rgba(70,50,30,.35)' : 'rgba(90,70,50,.22)'; for (let wy = y + 26; wy < y + h - 10; wy += 46) for (let wx = x + 14; wx < x + 80; wx += 30) ctx.fillRect(wx, wy, 14, 20); ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x, y, 6, h); ctx.restore(); if (hash(i + 4) > .45) { ctx.fillStyle = layer ? '#8c6f50' : '#a88d6c'; ctx.fillRect(x + 20, y - 34, 36, 34); ctx.fillStyle = layer ? '#c9a77f' : '#dcc7a6'; } }
  }
  // roof slab foreground
  ctx.fillStyle = '#e9dcc6'; ctx.fillRect(0, 1380, W, H - 1380); ctx.fillStyle = '#d5c3a6'; ctx.fillRect(0, 1380, W, 26);
  ctx.fillStyle = '#cbb593'; for (let x = 0; x < W; x += 140) ctx.fillRect(x, 1406, 4, 600);
  // pole
  const px = 560; const pg = ctx.createLinearGradient(px - 18, 0, px + 18, 0); pg.addColorStop(0, '#8b949e'); pg.addColorStop(.5, '#e6ebf0'); pg.addColorStop(1, '#7c858f'); ctx.fillStyle = pg; ctx.fillRect(px - 18, 760, 36, 660);
  ctx.fillStyle = '#6d757e'; ctx.fillRect(px - 70, 1400, 140, 26);
  // antenna drops in
  const drop = eback(seg(lt, .3, .9)), by = lerp(-500, 780, drop), bw = 360, bh = bw * BEAM.height / BEAM.width;
  // signal waves
  if (lt > 1.1) { ctx.save(); ctx.strokeStyle = GREEN; ctx.lineCap = 'round'; for (let i = 0; i < 4; i++) { const ph = ((lt - 1.1) * 1.3 + i * .25) % 1; ctx.globalAlpha = (1 - ph) * .9; ctx.lineWidth = 16; ctx.beginPath(); ctx.arc(px - 120, by + 20, 120 + ph * 420, Math.PI * .95, Math.PI * 1.35); ctx.stroke(); } ctx.restore(); }
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 30; ctx.drawImage(BEAM, px - bw * .62, by - bh / 2, bw, bh); ctx.restore();
  // signal bars meter
  const mp = eout(seg(lt, 1.2, 1.5)); if (mp > 0) {
    ctx.save(); ctx.globalAlpha = mp; ctx.fillStyle = 'rgba(2,55,108,.92)'; rr(W / 2 - 230, 1500, 460, 150, 34); ctx.fill();
    for (let i = 0; i < 5; i++) { const on = lt > 1.5 + i * .22; ctx.fillStyle = on ? GREEN : 'rgba(255,255,255,.25)'; const hh = 24 + i * 20; rr(W / 2 - 190 + i * 46, 1622 - hh, 32, hh, 8); ctx.fill(); }
    txt('إشارة كاملة', W / 2 + 95, 1575, 46, '#fff'); ctx.restore();
  }
  stamp('تم التركيب بنفس اليوم', W / 2, 330, t, 18.75, GREEN, -.08, 72);
  caption('تركيب احترافي على السطح', t, 16.6, 20.5);
}

// ---------- 4: the second call (S2) ----------
const K4 = [[20.6, 860, 1180, 1.6], [22.3, 860, 1180, 1.45], [22.8, 470, 760, 1.25], [24.8, 470, 760, 1.25], [25.1, 540, 960, 1.05], [28.2, 540, 960, 1.0]];
function sceneHappy(t) {
  const c = camAt(K4, t);
  const cc = withCam(c, () => {
    ctx.drawImage(S2, 0, 0);
    // crisp-screen glint sweep on the tablet
    ctx.save(); ctx.beginPath(); ctx.moveTo(655, 918); ctx.lineTo(1080, 905); ctx.lineTo(1080, 1470); ctx.lineTo(622, 1445); ctx.closePath(); ctx.clip();
    const sw = seg(t, 20.9, 21.6); if (sw > 0 && sw < 1) { const x = lerp(500, 1200, sw); const g = ctx.createLinearGradient(x - 120, 0, x + 120, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(500, 900, 700, 600); }
    // HD badge
    const hp = eback(seg(t, 21.3, 21.6)); if (hp > 0) { ctx.translate(745, 990); ctx.scale(hp, hp); ctx.fillStyle = GREEN; rr(-58, -32, 116, 64, 16); ctx.fill(); txt('HD', 0, 3, 42, '#fff', 700, 'center', 'ltr'); }
    ctx.restore();
    for (let i = 0; i < 7; i++) { const ph = (t * 1.4 + i * .37) % 1; if (t > 21.2) sparkle(760 + hash(i) * 260, 980 + hash(i + 2) * 300, 26 * Math.sin(ph * Math.PI), Math.sin(ph * Math.PI)); }
  });
  bubble(['مين هاد؟!', 'هاد غير شكل!'], 730, 300, toScreen(cc, 470, 620), t, 22.9, 24.85, { shout: 1, size: 70 });
  bubble(['لا لا…', 'قبلنا فيه!'], 730, 300, toScreen(cc, 470, 620), t, 25.2, 28.1, { size: 76 });
  // hearts burst from the tablet
  if (t > 25.3) for (let i = 0; i < 18; i++) { const lt = (t - 25.3 - hash(i) * .8); if (lt < 0) continue; const ph = (lt % 2.2) / 2.2; const x = 110 + hash(i + 1) * 380 + Math.sin(lt * 3 + i) * 30, y = 1150 - ph * 800; ctx.globalAlpha = 1 - ph; heart(x, y, .9 + hash(i + 3) * .9, i % 3 ? RED : '#ff7aa8'); ctx.globalAlpha = 1; }
  // zaghrouta
  const zp = seg(t, 25.8, 26.1); if (zp > 0) { const s = 'لولولولولييي!'; ctx.save(); ctx.translate(W / 2, 1520); ctx.rotate(-.06); ctx.scale(eback(zp), eback(zp)); ctx.font = `700 92px ${FONT}`; ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineWidth = 18; ctx.strokeStyle = '#fff'; ctx.translate(0, Math.sin(t * 22) * 6); ctx.strokeText(s, 0, 0); ctx.fillStyle = GREEN; ctx.fillText(s, 0, 0); ctx.restore(); }
  caption('المكالمة التانية… الصورة صافية', t, 20.8, 25.0);
  caption('صار العريس عريس!', t, 25.3, 28.15, GREEN);
}

// ---------- 5: end card ----------
function endCard(t) {
  const lt = t - 28.2;
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#033f7a'); g.addColorStop(1, '#011a35'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .07; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; for (let r = 120; r < 1600; r += 90) { ctx.beginPath(); ctx.arc(W / 2, 520, r + (lt * 40) % 90, 0, 7); ctx.stroke(); } ctx.restore();
  const lp = eback(seg(lt, 0, .45)), lw = 330, lh = lw * LOGO.height / LOGO.width;
  ctx.save(); ctx.translate(W / 2, 470); ctx.scale(lp, lp); ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 50; ctx.fillStyle = '#fff'; rr(-lw / 2 - 34, -lh / 2 - 30, lw + 68, lh + 60, 40); ctx.fill(); ctx.shadowColor = 'transparent'; ctx.drawImage(LOGO, -lw / 2, -lh / 2, lw, lh); ctx.restore();
  const a = eout(seg(lt, .35, .7)); ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 40);
  txt('مع مركز مكة…', W / 2, 870, 72, '#fff'); ctx.restore();
  const b = eback(seg(lt, .7, 1.05)); ctx.save(); ctx.translate(W / 2, 975); ctx.scale(b, b); ctx.rotate(-.03); txt('حتى الحماية بتقبل!', 0, 0, 92, GREEN); ctx.restore();
  const chips = [['إنترنت لاسلكي', 'تركيب راوترات'], ['كاميرات مراقبة', 'طاقة شمسية']];
  chips.forEach((row, r) => row.forEach((s, i) => { const p = eout(seg(lt, 1.2 + (r * 2 + i) * .12, 1.5 + (r * 2 + i) * .12)); if (p <= 0) return; ctx.save(); ctx.globalAlpha = p; ctx.font = `700 46px ${FONT}`; ctx.direction = 'rtl'; const w = 400, x = i === 0 ? W / 2 + 15 : W / 2 - 15 - w, y = 1110 + r * 108 + (1 - p) * 30; ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; rr(x, y, w, 84, 42); ctx.fill(); ctx.stroke(); txt(s, x + w / 2, y + 44, 44, '#fff'); ctx.restore(); }));
  // phone pill — number centred inside, icon on its own side
  const pp = eback(seg(lt, 2.0, 2.4)); if (pp > 0) {
    ctx.save(); ctx.translate(W / 2, 1450); ctx.scale(pp, pp);
    const pw = 760, ph = 150; ctx.shadowColor = 'rgba(80,190,30,.6)'; ctx.shadowBlur = 40; ctx.fillStyle = GREEN; rr(-pw / 2, -ph / 2, pw, ph, ph / 2); ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(pw / 2 - 80, 0, 50, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(pw / 2 - 80, 0); ctx.rotate(-.5); ctx.fillStyle = GREEN; rr(-12, -30, 24, 60, 12); ctx.fill(); rr(-22, -32, 30, 18, 8); ctx.fill(); rr(-22, 14, 30, 18, 8); ctx.fill(); ctx.restore();
    txt('0982 621 531', -40, 4, 76, '#fff', 700, 'center', 'ltr'); ctx.restore();
  }
  const ap = eout(seg(lt, 2.6, 3.0)); ctx.save(); ctx.globalAlpha = ap; txt('حمص – القصور – خلف جامع حمود الناصر', W / 2, 1610, 46, '#fff', 500); ctx.restore();
  const cp = eout(seg(lt, 3.2, 3.6)); ctx.save(); ctx.globalAlpha = cp; ctx.font = `700 50px ${FONT}`; ctx.direction = 'rtl'; const w = ctx.measureText('احجز تركيبك الآن معنا').width + 90; ctx.fillStyle = '#fff'; rr(W / 2 - w / 2, 1700, w, 96, 48); ctx.fill(); txt('احجز تركيبك الآن معنا', W / 2, 1750, 50, NAVY); ctx.restore();
}

// music grid (120 BPM): map beat-aligned film time -> original animation time
const WARP = [[0, 0], [1.5, 1.4], [2.5, 2.25], [3.5, 3.55], [4.5, 4.55], [5.0, 4.95], [7.0, 6.95], [7.5, 7.3], [9.0, 9.0], [10.5, 10.6], [11.5, 11.3], [13.0, 13.1], [15.0, 14.9], [16.5, 16.4], [18.5, 18.75], [20.5, 20.6], [23.0, 22.9], [25.0, 25.2], [26.0, 25.8], [28.0, 28.2], [34, 34]];
function warpT(t) { for (let i = 1; i < WARP.length; i++) if (t <= WARP[i][0]) { const [a0, b0] = WARP[i - 1], [a1, b1] = WARP[i]; return b0 + (t - a0) / (a1 - a0) * (b1 - b0); } return t; }
function renderFrame(tm) {
  const t = warpT(tm);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.clearRect(0, 0, W, H);
  if (t < 1.4) title(t);
  else if (t < 10.6) sceneCall(t);
  else if (t < 16.4) sceneRun(t);
  else if (t < 20.6) sceneRoof(t);
  else if (t < 28.2) sceneHappy(t);
  else endCard(t);
  if (t >= 1.4 && t < 28.2) badge(1, t < 10.6);
  for (const T of [1.4, 10.6, 16.4, 20.6, 28.2]) whip(t, T);
  // fade in/out
  const f = Math.max(1 - seg(t, 0, .25), seg(t, DUR - .4, DUR)); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
}
window.render = t => renderFrame(t);
window.ready = (async () => {
  [S1, S2, S3, LOGO, BEAM] = await Promise.all(['scenes/s1.png', 'scenes/s2.png', 'scenes/s3.png', 'assets/logo-vertical.png', 'assets/litebeam.png'].map(load));
  await document.fonts.load(`700 60px "Readex Pro"`, 'مكة'); await document.fonts.load(`500 60px "IBM Plex Sans Arabic"`, 'مكة'); await document.fonts.load(`700 60px "Readex Pro"`, 'HD 0982');
  await document.fonts.ready; renderFrame(0); return true;
})();
