<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مركز مكة — خدمات</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Makkah Technologies services promo — 1080x1920, 42s. Every frame comes from render(t).
const W = 1080, H = 1920, DUR = 42;
const C = { navy: '#02376C', green: '#50BE1E', night: '#04152B', white: '#F3F6FA', red: '#E5484D', cyan: '#5FE3FF' };
const DISPLAY = '"Readex Pro","IBM Plex Sans Arabic",sans-serif';
const BODY = '"IBM Plex Sans Arabic","Readex Pro",sans-serif';
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eout = p => 1 - Math.pow(1 - p, 3);
const eoutExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const einExpo = p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10);
const eback = p => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const smooth = p => p * p * (3 - 2 * p);
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// Arabic headline, words rise in from the right one after another.
function words(text, x, y, size, t, tin, tout, o = {}) {
  if (t < tin || t > tout + 0.6) return;
  ctx.save();
  ctx.font = `${o.weight || 700} ${size}px ${o.font || DISPLAY}`; ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const ws = text.split(' '), sp = ctx.measureText(' ').width, wd = ws.map(w => ctx.measureText(w).width);
  const total = wd.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let cx = x + total / 2;
  const outP = eio(seg(t, tout, tout + 0.4));
  ws.forEach((w, i) => {
    const st = o.stagger ?? 0.09, p = eout(seg(t, tin + i * st, tin + i * st + 0.45)), a = p * (1 - outP);
    if (a > 0.003) {
      ctx.globalAlpha = a; ctx.filter = `blur(${((1 - p) * 12 + outP * 10).toFixed(1)}px)`;
      ctx.shadowColor = 'rgba(0,8,20,.6)'; ctx.shadowBlur = 26;
      ctx.fillStyle = (o.colors && o.colors[i]) || o.color || C.white;
      ctx.fillText(w, cx, y + (1 - p) * 40 - outP * 26);
    }
    cx -= wd[i] + sp;
  });
  ctx.restore();
}
function thread(pts, width = 10, alpha = 1, col = C.green) {
  if (pts.length < 2 || alpha <= 0) return;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const path = () => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); };
  ctx.globalAlpha = alpha * .35; ctx.strokeStyle = col; ctx.lineWidth = width * 3; ctx.shadowColor = col; ctx.shadowBlur = 40; path(); ctx.stroke();
  ctx.globalAlpha = alpha * .9; ctx.lineWidth = width; ctx.shadowBlur = 20; path(); ctx.stroke();
  ctx.globalAlpha = alpha; ctx.strokeStyle = '#E9FFD9'; ctx.lineWidth = width * .32; ctx.shadowBlur = 0; path(); ctx.stroke();
  ctx.restore();
}
function glow(x, y, r = 60, a = 1, rgb = '120,230,70') {
  if (a <= 0) return;
  ctx.save(); const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(235,255,220,${a})`); g.addColorStop(.25, `rgba(${rgb},${.6 * a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore();
}
function flash(a, col = '220,255,200') { if (a <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(${col},${a})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
function arcPts(cx, cy, r, a0, a1, n = 80) { const p = []; for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return p; }
function label(text, x, y, size, col = C.white, weight = 700, font = DISPLAY, align = 'center', dir = 'rtl') {
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; ctx.direction = dir; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(text, x, y); ctx.restore();
}

// ---------- assets ----------
const IMG = {};
function loadImg(k, src) { return new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.src = src; }); }
let GRAIN, VIGN, PARTS;
function buildCommon() {
  GRAIN = mk(512, 512); const g = GRAIN.getContext('2d'); const d = g.createImageData(512, 512); const r = rng(3);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0);
  VIGN = mk(W, H); const v = VIGN.getContext('2d'); const gr = v.createRadialGradient(W / 2, H * .48, H * .3, W / 2, H * .5, H * .8);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,4,12,.6)'); v.fillStyle = gr; v.fillRect(0, 0, W, H);
  const pr = rng(4); PARTS = []; for (let i = 0; i < 70; i++) PARTS.push([pr() * W, pr() * H, pr() * 2.4 + .6, pr() * .5 + .2, pr()]);
}

// ---------- brand background: night navy, perspective grid, drifting particles ----------
function bg(t, tint = 0) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#020C1C'); g.addColorStop(.55, '#03214A'); g.addColorStop(1, '#021226');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const hz = 1180;
  ctx.save(); ctx.strokeStyle = 'rgba(80,190,30,.10)'; ctx.lineWidth = 2;
  for (let i = -12; i <= 12; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * 40, hz); ctx.lineTo(W / 2 + i * 260, H); ctx.stroke(); }
  for (let k = 0; k < 14; k++) { const q = ((k + (t * .6) % 1) / 14); const y = hz + Math.pow(q, 2.2) * (H - hz); ctx.globalAlpha = q; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  const hg = ctx.createRadialGradient(W / 2, hz, 10, W / 2, hz, 700); hg.addColorStop(0, 'rgba(80,190,30,.20)'); hg.addColorStop(1, 'rgba(80,190,30,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, hz - 700, W, 1400);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, s, sp, ph] of PARTS) { ctx.fillStyle = `rgba(170,255,130,${.25 + .25 * Math.sin(t * 2 + ph * 6)})`; ctx.beginPath(); ctx.arc(x + Math.sin(t * .5 + ph * 9) * 20, (y - t * 40 * sp + H * 4) % H, s, 0, 7); ctx.fill(); }
  ctx.restore();
}

// ---------- icon library ----------
function panelAntenna(c, x, y, sc = 1, glowA = 0) { // LiteBeam-style panel
  c.save(); c.translate(x, y); c.scale(sc, sc);
  c.strokeStyle = '#7F93AA'; c.lineWidth = 9; c.beginPath(); c.moveTo(14, 30); c.lineTo(14, 170); c.stroke();
  const g = c.createLinearGradient(-80, -60, 80, 60); g.addColorStop(0, '#FFFFFF'); g.addColorStop(.6, '#DCE3EA'); g.addColorStop(1, '#AAB6C3');
  c.fillStyle = g; c.beginPath(); c.moveTo(-82, -48); c.quadraticCurveTo(0, -66, 82, -48); c.quadraticCurveTo(70, 0, 82, 48); c.quadraticCurveTo(0, 66, -82, 48); c.quadraticCurveTo(-70, 0, -82, -48); c.closePath(); c.fill();
  c.fillStyle = 'rgba(90,110,130,.45)'; for (let i = -70; i <= 70; i += 9) for (let j = -44; j <= 44; j += 9) if (Math.abs(i) > 22) { c.beginPath(); c.arc(i, j, 1.4, 0, 7); c.fill(); }
  c.fillStyle = '#F4F7FA'; c.fillRect(-20, -58, 40, 116);
  c.fillStyle = '#EEF2F6'; c.beginPath(); c.moveTo(-10, -6); c.lineTo(-62, 4); c.lineTo(-62, 26); c.lineTo(-10, 14); c.closePath(); c.fill();
  c.fillStyle = '#FFFFFF'; rr(c, -84, -4, 30, 34, 6); c.fill();
  if (glowA > 0) { c.globalCompositeOperation = 'lighter'; c.fillStyle = `rgba(80,190,30,${glowA})`; c.beginPath(); c.arc(-70, 12, 9, 0, 7); c.fill(); }
  c.restore();
}
function powerBeam(x, y, sc = 1) { // PowerBeam-style dish with feed and rear radio
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.strokeStyle = '#7F93AA'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(0, 60); ctx.lineTo(0, 200); ctx.stroke();
  ctx.fillStyle = '#C4CEDA'; rr(ctx, 30, -26, 46, 60, 8); ctx.fill();
  const g = ctx.createRadialGradient(-20, -20, 10, 0, 0, 110); g.addColorStop(0, '#FFFFFF'); g.addColorStop(.7, '#DDE4EC'); g.addColorStop(1, '#A9B5C2');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 70, 105, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(120,140,160,.5)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, 0, 58, 90, 0, 0, 7); ctx.stroke();
  ctx.strokeStyle = '#E8EDF3'; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-95, 0); ctx.stroke();
  ctx.fillStyle = '#FFFFFF'; rr(ctx, -120, -18, 34, 36, 8); ctx.fill();
  ctx.restore();
}
function router(x, y, sc, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.strokeStyle = '#1C3B60'; ctx.lineWidth = 14; ctx.lineCap = 'round';
  [[-110, -10, -150, -170], [0, -10, 0, -190], [110, -10, 150, -170]].forEach(([a, b, c2, d]) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c2, d); ctx.stroke(); });
  const g = ctx.createLinearGradient(0, -40, 0, 60); g.addColorStop(0, '#16304F'); g.addColorStop(1, '#0B1B30');
  ctx.fillStyle = g; rr(ctx, -190, -40, 380, 100, 26); ctx.fill(); ctx.strokeStyle = 'rgba(95,227,255,.25)'; ctx.lineWidth = 2; ctx.stroke();
  for (let i = 0; i < 5; i++) { const on = Math.sin(t * 9 - i * 1.3) > -.2; ctx.fillStyle = on ? C.green : '#24415F'; ctx.beginPath(); ctx.arc(-110 + i * 55, 12, 8, 0, 7); ctx.fill(); if (on) glow(-110 + i * 55, 12, 30, .5); }
  ctx.restore();
}
function wifiIcon(x, y, s, a = 1, col = C.green) {
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = s * .14;
  for (let i = 1; i <= 3; i++) { ctx.beginPath(); ctx.arc(x, y, s * i * .3, Math.PI * 1.25, Math.PI * 1.75); ctx.stroke(); }
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y - s * .02, s * .09, 0, 7); ctx.fill(); ctx.restore();
}
function check(x, y, s, p, col = C.green) {
  if (p <= 0) return;
  ctx.save(); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, s * eback(clamp(p * 1.5)), 0, 7); ctx.fill();
  const q = seg(p, .3, 1); ctx.strokeStyle = '#fff'; ctx.lineWidth = s * .22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); const pts = [[x - s * .45, y + s * .02], [x - s * .12, y + s * .34], [x + s * .5, y - s * .32]];
  ctx.moveTo(pts[0][0], pts[0][1]); const k = q * 2;
  if (k <= 1) ctx.lineTo(lerp(pts[0][0], pts[1][0], k), lerp(pts[0][1], pts[1][1], k));
  else { ctx.lineTo(pts[1][0], pts[1][1]); ctx.lineTo(lerp(pts[1][0], pts[2][0], k - 1), lerp(pts[1][1], pts[2][1], k - 1)); }
  ctx.stroke(); ctx.restore();
}

// ================= A — hook: the buffering phone (0–3s) =================
function sceneHook(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0A0710'); g.addColorStop(1, '#1A0B12');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const rg = ctx.createRadialGradient(W / 2, 1100, 50, W / 2, 1100, 800); rg.addColorStop(0, 'rgba(229,72,77,.18)'); rg.addColorStop(1, 'rgba(229,72,77,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  const shake = t > 1.8 ? (rng(Math.floor(t * 30))() - .5) * 10 * seg(t, 1.8, 2.8) : 0;
  const z = lerp(1, 1.08, eio(seg(t, 0, 3)));
  ctx.save(); ctx.translate(W / 2 + shake, 1120); ctx.scale(z, z); ctx.rotate(-0.04);
  // phone
  ctx.fillStyle = '#05080E'; rr(ctx, -270, -520, 540, 1040, 64); ctx.fill();
  ctx.strokeStyle = '#2A3240'; ctx.lineWidth = 6; ctx.stroke();
  ctx.save(); rr(ctx, -246, -496, 492, 992, 46); ctx.clip();
  ctx.fillStyle = '#20242C'; ctx.fillRect(-246, -496, 492, 992);
  // frozen grey video
  ctx.fillStyle = '#3A3F49'; ctx.fillRect(-246, -360, 492, 300);
  ctx.fillStyle = '#4A505B'; ctx.beginPath(); ctx.moveTo(-246, -60); ctx.lineTo(-120, -200); ctx.lineTo(-20, -110); ctx.lineTo(80, -230); ctx.lineTo(246, -60); ctx.fill();
  // spinner
  for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283 + Math.floor(t * 12) / 12 * 6.283; ctx.strokeStyle = `rgba(255,255,255,${.15 + .85 * (i / 12)})`; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 34, -210 + Math.sin(a) * 34); ctx.lineTo(Math.cos(a) * 58, -210 + Math.sin(a) * 58); ctx.stroke(); }
  // stuck progress
  ctx.fillStyle = 'rgba(255,255,255,.15)'; rr(ctx, -200, 40, 400, 18, 9); ctx.fill();
  ctx.fillStyle = C.red; rr(ctx, -200, 40, 400 * (.12 + .01 * Math.min(t, 1)), 18, 9); ctx.fill();
  label('13%', 0, 100, 40, '#C9CED6', 700, BODY, 'center', 'ltr');
  // signal bars dropping
  for (let i = 0; i < 4; i++) { const alive = t < 0.6 + (3 - i) * 0.45; ctx.fillStyle = alive ? '#E8ECF2' : 'rgba(255,255,255,.18)'; ctx.fillRect(-200 + i * 26, -440 - i * 14, 18, 20 + i * 14); }
  label('لا توجد إشارة', 160, -440, 30, C.red, 700, BODY);
  // error toast
  const ta = eback(seg(t, 1.2, 1.6));
  if (ta > 0) { ctx.save(); ctx.translate(0, 260); ctx.scale(ta, ta); ctx.fillStyle = 'rgba(229,72,77,.95)'; rr(ctx, -200, -55, 400, 110, 28); ctx.fill(); label('انقطع الاتصال', 0, 2, 44, '#fff'); ctx.restore(); }
  ctx.restore();
  ctx.restore();
  // headline
  words('تعبت من ضعف', W / 2, 330, 104, t, 0.15, 2.65);
  words('الإنترنت والتقطيع؟', W / 2, 460, 104, t, 0.55, 2.65, { colors: [C.white, C.red] });
  // glitch slices
  if ((t > .9 && t < 1.05) || (t > 1.75 && t < 1.95) || t > 2.5) {
    const r = rng(Math.floor(t * 30) + 7);
    for (let i = 0; i < 9; i++) { const y = r() * H, h = 20 + r() * 120, dx = (r() - .5) * 90; ctx.drawImage(cv, 0, y, W, h, dx, y, W, h); }
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .25; ctx.drawImage(cv, 8, 0); ctx.restore();
  }
  // green thread breaks in
  const p = einExpo(seg(t, 2.45, 3.0));
  if (p > 0) { const pts = []; for (let i = 0; i <= 40 * p; i++) { const q = i / 40; pts.push([lerp(-40, W / 2, q) + Math.sin(q * 7) * 60, lerp(H + 40, 1000, q)]); } thread(pts, 14); const h = pts[pts.length - 1]; glow(h[0], h[1], 160); }
  flash(einExpo(seg(t, 2.75, 3.0)));
}

// ================= B — logo reveal (3–6s) =================
function sceneLogo(t) {
  const u = t - 3; bg(t);
  const CX = 540, CY = 820, R = 330;
  const ring = eoutExpo(seg(u, 0, .8));
  if (ring > 0) thread(arcPts(CX, CY, R + 30, -Math.PI / 2, -Math.PI / 2 - Math.PI * 2 * ring, 120), 9, 1 - seg(u, 1.2, 2.2) * .5);
  const lp = eback(seg(u, .55, 1.05));
  if (lp > 0) {
    const s = lp; ctx.save(); ctx.translate(CX, CY); ctx.scale(s, s);
    glow(0, 0, R * 1.9, .5);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, R * .99, 0, 7); ctx.fill();
    ctx.drawImage(IMG.logo, -R, -R, 2 * R, 2 * R); ctx.restore();
    const sw = seg(u, .6, 1.6); ctx.save(); ctx.strokeStyle = `rgba(190,255,150,${(1 - sw) * .9})`; ctx.lineWidth = 12 * (1 - sw) + 1; ctx.beginPath(); ctx.arc(CX, CY, R + sw * 700, 0, 7); ctx.stroke(); ctx.restore();
  }
  words('مركز مكة لتخديم الإنترنت', W / 2, 1300, 76, t, 3.95, 5.7);
  words('حمص', W / 2, 1420, 92, t, 4.35, 5.7, { color: C.green });
  flash((1 - seg(u, 0, .4)) * .9);
}

// ================= C — three promises + speed gauge (6–9s) =================
function sceneValues(t) {
  const u = t - 6; bg(t);
  const items = [['إنترنت قوي', 6.1], ['خدمة مميزة', 6.55], ['أسعار بتناسب الجميع', 7.0]];
  items.forEach(([s, ti], i) => {
    const y = 420 + i * 150;
    words(s, W / 2 - 40, y, 88, t, ti, 8.65);
    ctx.save(); ctx.font = `700 88px ${DISPLAY}`; const tw = ctx.measureText(s).width; ctx.restore();
    const p = eout(seg(t, ti + .1, ti + .5)) * (1 - seg(t, 8.65, 9));
    check(W / 2 - 40 + tw / 2 + 60, y, 34, p);
  });
  // speed gauge
  const gx = 540, gy = 1330, gr = 300;
  const a0 = Math.PI * .8, a1 = Math.PI * 2.2;
  const fade = seg(u, 0, .3) * (1 - seg(u, 2.7, 3));
  ctx.save(); ctx.globalAlpha = fade;
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 34; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(gx, gy, gr, a0, a1); ctx.stroke();
  const v = clamp(eback(seg(u, .3, 1.6)) * .92, 0, 1.0);
  const grd = ctx.createLinearGradient(gx - gr, 0, gx + gr, 0); grd.addColorStop(0, '#1E7A0C'); grd.addColorStop(1, '#9BF06A');
  ctx.strokeStyle = grd; ctx.shadowColor = C.green; ctx.shadowBlur = 30; ctx.beginPath(); ctx.arc(gx, gy, gr, a0, lerp(a0, a1, v)); ctx.stroke(); ctx.shadowBlur = 0;
  for (let i = 0; i <= 10; i++) { const a = lerp(a0, a1, i / 10); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(gx + Math.cos(a) * (gr - 50), gy + Math.sin(a) * (gr - 50)); ctx.lineTo(gx + Math.cos(a) * (gr - 70), gy + Math.sin(a) * (gr - 70)); ctx.stroke(); }
  const na = lerp(a0, a1, v + Math.sin(u * 40) * .004);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + Math.cos(na) * (gr - 80), gy + Math.sin(na) * (gr - 80)); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(gx, gy, 22, 0, 7); ctx.fill();
  label(String(Math.round(v * 100)).padStart(2, '0'), gx, gy + 120, 96, '#fff', 700, BODY, 'center', 'ltr');
  label('Mbps', gx, gy + 190, 34, 'rgba(255,255,255,.6)', 500, BODY, 'center', 'ltr');
  ctx.restore();
}

// ================= D — seven services (9–30s) =================
const SERV = [
  { t: 9, title: ['تركيب إنترنت هوائي', 'باحترافية'], draw: iconAir },
  { t: 12, title: ['أجهزة استقبال حديثة', 'LiteBeam و PowerBeam'], draw: iconDevices },
  { t: 15, title: ['تجهيز وبرمجة', 'الراوترات'], draw: iconRouter },
  { t: 18, title: ['للمنازل والمحلات', 'والمكاتب'], draw: iconPlaces },
  { t: 21, title: ['كاميرات مراقبة ذكية', 'بدقة عالية'], draw: iconCam },
  { t: 24, title: ['طاقة شمسية', 'وتكييف'], draw: iconSolar },
  { t: 27, title: ['متابعة فنية وخدمة', 'بعد التركيب'], draw: iconCare },
];
function sceneServices(t) {
  bg(t);
  const i = Math.min(6, Math.floor((t - 9) / 3)), s = SERV[i], u = t - s.t;

    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(16, -16); ctx.lineTo(16, 16); ctx.closePath(); ctx.fill(); ctx.restore();
    // hearts float up after sending
    for (let k = 0; k < 6; k++) { const q = seg(v, 2.1 + k * .12, 3.0 + k * .12); if (q <= 0 || q >= 1) continue; const x = 200 + Math.sin(k * 2 + q * 5) * 40, y = 1250 - q * 260; ctx.save(); ctx.globalAlpha = 1 - q; ctx.fillStyle = k % 2 ? C.green : C.red; ctx.translate(x, y); ctx.scale(1.4, 1.4); ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-14, -6, -6, -18, 0, -9); ctx.bezierCurveTo(6, -18, 14, -6, 0, 6); ctx.fill(); ctx.restore(); }
    ctx.restore();
  }
}

// ---------- timeline ----------
function drawScene(t) {
  if (t < 3) sceneHook(t);
  else if (t < 6) sceneLogo(t);
  else if (t < 9) sceneValues(t);
  else if (t < 30) sceneServices(t);
  else if (t < 34) scenePromise(t);
  else sceneContact(t);
  // soft dip between big sections
  for (const c of [6, 9, 30, 34]) { const d = 1 - Math.abs(t - c) / .18; if (d > 0) { ctx.save(); ctx.globalAlpha = d * .55; ctx.fillStyle = '#020C1C'; ctx.fillRect(0, 0, W, H); ctx.restore(); } }
  if (t > 41.5) { ctx.save(); ctx.globalAlpha = seg(t, 41.5, 42) * .6; ctx.fillStyle = '#020C1C'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}
function post(t) {
  ctx.drawImage(VIGN, 0, 0);
  ctx.save(); ctx.globalAlpha = .07; ctx.globalCompositeOperation = 'overlay';
  const r = rng(Math.floor(t * 30) + 1), ox = -r() * 512, oy = -r() * 512;
  for (let x = ox; x < W; x += 512) for (let y = oy; y < H; y += 512) ctx.drawImage(GRAIN, x, y);
  ctx.restore();
}
function render(t) { ctx.save(); ctx.clearRect(0, 0, W, H); drawScene(t); post(t); ctx.restore(); }
window.ready = (async () => {
  await Promise.all([loadImg('logo', 'assets/logo.webp'), loadImg('card', 'assets/card.webp')]);
  await Promise.all([document.fonts.load('700 80px "Readex Pro"', 'مكة'), document.fonts.load('500 80px "Readex Pro"', 'مكة'), document.fonts.load('700 60px "IBM Plex Sans Arabic"', 'مكة 0982'), document.fonts.load('500 40px "IBM Plex Sans Arabic"', 'حمص')]);
  buildCommon(); return true;
})();
window.render = render;
</script>
