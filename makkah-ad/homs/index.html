<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>من قلب حمص — مركز مكة</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#232427}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// «من قلب حمص» — paper-theatre film for Makkah Technologies. 1080x1920, 35s.
// The black-and-white ablaq stone of Homs turns into signal bars and Wi-Fi arcs.
// Every frame comes from render(t).
const W = 1080, H = 1920, DUR = 35;
const K = '#232427', K2 = '#34363b', K3 = '#4a4d54', C1 = '#F3EBDA', C2 = '#E4D8BE', C3 = '#CDBF9F', C4 = '#B3A383', G = '#50BE1E', G2 = '#2F8F10', GL = '#B8F08F';
const DISPLAY = '"Readex Pro","IBM Plex Sans Arabic",sans-serif', BODY = '"IBM Plex Sans Arabic","Readex Pro",sans-serif';
const cv = document.getElementById('c'); let ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eout = p => 1 - Math.pow(1 - p, 3);
const eback = p => { const c1 = 1.7, c3 = c1 + 1; return Math.max(0, 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2)); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rrp(x, y, w, h, r) { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
// a piece of cut paper: filled shape with a soft drop shadow underneath
function paper(fill, depth, draw) {
  ctx.save(); if (depth > 0) { ctx.shadowColor = 'rgba(28,18,6,.42)'; ctx.shadowBlur = 9 * depth; ctx.shadowOffsetY = 6 * depth; ctx.shadowOffsetX = 2 * depth; }
  ctx.fillStyle = fill; ctx.beginPath(); draw(); ctx.fill(); ctx.restore();
}
const rect = (fill, d, x, y, w, h, r = 0) => paper(fill, d, () => r ? rrp(x, y, w, h, r) : ctx.rect(x, y, w, h));
const circ = (fill, d, x, y, r) => paper(fill, d, () => ctx.arc(x, y, r, 0, 7));
function label(text, x, y, size, col, weight = 700, font = DISPLAY, align = 'center', dir = 'rtl') { ctx.save(); ctx.font = `${weight} ${size}px ${font}`; ctx.direction = dir; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(text, x, y); ctx.restore(); }
// headline on a strip of paper
function tag(text, y, t, tin, tout, o = {}) {
  const p = eback(seg(t, tin, tin + .45)) * (1 - eio(seg(t, tout, tout + .3))); if (p <= 0.001) return;
  const size = o.size || 64; ctx.save(); ctx.font = `700 ${size}px ${DISPLAY}`; ctx.direction = 'rtl'; const w = ctx.measureText(text).width + size * 1.1, h = size * 1.62;
  ctx.translate(o.x || W / 2, y); ctx.rotate((o.rot ?? -1.6) * Math.PI / 180); ctx.scale(p, p);
  const bg = o.green ? G : o.dark ? K : C1, fg = o.green ? '#fff' : o.dark ? C1 : K;
  rect(bg, 1.6, -w / 2, -h / 2, w, h, 10);
  ctx.strokeStyle = o.green ? 'rgba(255,255,255,.35)' : o.dark ? 'rgba(243,235,218,.25)' : 'rgba(35,36,39,.18)'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]); ctx.beginPath(); rrp(-w / 2 + 9, -h / 2 + 9, w - 18, h - 18, 6); ctx.stroke(); ctx.setLineDash([]);
  label(text, 0, 3, size, fg); ctx.restore();
}
// ablaq: alternating basalt / limestone courses
function ablaq(x, y, w, h, n, d = 0, a = K, b = C1) { for (let i = 0; i < n; i++) rect(i % 2 ? b : a, d, x, y + i * h / n, w, h / n + .5); }
let GRAIN, LOGO;
function buildGrain() { GRAIN = mk(540, 540); const g = GRAIN.getContext('2d'); const d = g.createImageData(540, 540); const r = rng(5); for (let i = 0; i < d.data.length; i += 4) { const v = 150 + r() * 105; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); g.strokeStyle = 'rgba(90,70,40,.10)'; for (let i = 0; i < 260; i++) { g.lineWidth = r() * 1.2; g.beginPath(); const x = r() * 540, y = r() * 540, a = r() * 6.28, l = 6 + r() * 26; g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); } }

// ---------- little paper props ----------
function car(x, y, s, col) { ctx.save(); ctx.translate(x, y); ctx.scale(s, Math.abs(s)); paper(col, 1, () => { rrp(-70, -34, 140, 44, 12); ctx.moveTo(-40, -34); ctx.lineTo(-26, -62); ctx.lineTo(30, -62); ctx.lineTo(48, -34); ctx.closePath(); }); rect(C1, 0, -22, -56, 22, 20, 3); rect(C1, 0, 6, -56, 24, 20, 3); circ(K, .5, -40, 10, 15); circ(K, .5, 40, 10, 15); circ(C3, 0, -40, 10, 6); circ(C3, 0, 40, 10, 6); ctx.restore(); }
function bird(x, y, s, flap, col = K2) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); paper(col, .6, () => { ctx.ellipse(0, 0, 20, 9, 0, 0, 7); ctx.moveTo(14, -4); ctx.lineTo(30, -1); ctx.lineTo(14, 3); ctx.closePath(); }); paper(col, .5, () => { ctx.moveTo(-10, -2); ctx.quadraticCurveTo(-4, -34 * flap, 16, -22 * flap); ctx.lineTo(4, -2); ctx.closePath(); }); ctx.restore(); }
function person(x, y, s, col, head = C3, bob = 0) { ctx.save(); ctx.translate(x, y + bob); ctx.scale(s, s); paper(col, 1, () => { ctx.moveTo(-26, 0); ctx.quadraticCurveTo(-30, -92, 0, -96); ctx.quadraticCurveTo(30, -92, 26, 0); ctx.closePath(); }); circ(head, .8, 0, -122, 24); ctx.restore(); }
function tree(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); rect(K2, .5, -5, -50, 10, 50); circ(K3, 1, 0, -74, 34); circ(K2, .6, -14, -86, 20); ctx.restore(); }
function dome(x, y, r, col, d = 1) { paper(col, d, () => { ctx.moveTo(x - r, y); ctx.bezierCurveTo(x - r, y - r * .95, x - r * .25, y - r * 1.15, x, y - r * 1.4); ctx.bezierCurveTo(x + r * .25, y - r * 1.15, x + r, y - r * .95, x + r, y); ctx.closePath(); }); rect(col, 0, x - 3, y - r * 1.4 - 22, 6, 24); }
function minaret(x, base, h, col, d = 1) { rect(col, d, x - 16, base - h, 32, h); rect(col, d, x - 26, base - h * .72, 52, 14); paper(col, d, () => { ctx.moveTo(x - 18, base - h); ctx.lineTo(x, base - h - 90); ctx.lineTo(x + 18, base - h); ctx.closePath(); }); }
function antenna(x, y, s, glow) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); rect(K2, .6, 8, 20, 9, 120); paper('#FBF8F0', 1.2, () => { ctx.moveTo(-70, -42); ctx.quadraticCurveTo(0, -56, 70, -42); ctx.quadraticCurveTo(60, 0, 70, 42); ctx.quadraticCurveTo(0, 56, -70, 42); ctx.quadraticCurveTo(-60, 0, -70, -42); ctx.closePath(); }); ctx.fillStyle = C4; for (let i = -58; i <= 58; i += 10) for (let j = -34; j <= 34; j += 10) if (Math.abs(i) > 20) { ctx.beginPath(); ctx.arc(i, j, 1.6, 0, 7); ctx.fill(); } rect(C1, .4, -17, -50, 34, 100); paper(C1, .6, () => { ctx.moveTo(-8, -6); ctx.lineTo(-54, 2); ctx.lineTo(-54, 22); ctx.lineTo(-8, 12); ctx.closePath(); }); rect('#fff', .6, -74, -6, 26, 30, 5); if (glow > 0) { ctx.fillStyle = G; ctx.globalAlpha = glow; ctx.beginPath(); ctx.arc(-61, 9, 8, 0, 7); ctx.fill(); } ctx.restore(); }
function thread(pts, p, w = 9) { if (p <= 0) return; const n = Math.max(2, Math.round((pts.length - 1) * p) + 1); ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowColor = 'rgba(28,18,6,.35)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 4; ctx.strokeStyle = G; ctx.lineWidth = w; ctx.beginPath(); for (let i = 0; i < n; i++) i ? ctx.lineTo(pts[i][0], pts[i][1]) : ctx.moveTo(pts[i][0], pts[i][1]); ctx.stroke(); ctx.shadowColor = 'transparent'; ctx.strokeStyle = GL; ctx.lineWidth = w * .3; ctx.setLineDash([14, 12]); ctx.stroke(); ctx.restore(); }
function curve(a, c, b, n = 40) { const o = []; for (let i = 0; i <= n; i++) { const q = i / n; o.push([(1 - q) * (1 - q) * a[0] + 2 * (1 - q) * q * c[0] + q * q * b[0], (1 - q) * (1 - q) * a[1] + 2 * (1 - q) * q * c[1] + q * q * b[1]]); } return o; }
function wifi(x, y, s, lit, col = G) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); for (let i = 3; i >= 1; i--) { const on = lit >= i; ctx.save(); ctx.shadowColor = 'rgba(28,18,6,.38)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 5; ctx.strokeStyle = on ? col : C3; ctx.lineWidth = 26; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 0, i * 52, Math.PI * 1.22, Math.PI * 1.78); ctx.stroke(); ctx.restore(); } circ(lit >= 0 ? col : C3, 1, 0, 0, 20); ctx.restore(); }
const BARS = [0, 1, 2, 3, 4].map(i => ({ x: 300 + i * 120, w: 84, h: 130 + i * 92 }));
function bars(baseY, lit, t, alpha = 1, sc = 1, cx = 540) { ctx.save(); ctx.globalAlpha = alpha; ctx.translate(cx, baseY); ctx.scale(sc, sc); ctx.translate(-540, 0); BARS.forEach((b, i) => { const on = lit > i, pop = on ? 1 + .12 * Math.max(0, 1 - Math.abs(lit - i - .5) * 2) : 1; ctx.save(); ctx.translate(b.x, 0); ctx.scale(pop, pop); rect(on ? G : C3, 1.2, -b.w / 2, -b.h, b.w, b.h, 8); if (on) rect(GL, 0, -b.w / 2 + 10, -b.h + 10, 12, b.h - 20, 6); ctx.restore(); }); ctx.restore(); }

// ================= 1 — ablaq wall becomes signal bars (0–4) =================
function s1(t) {
  rect(C1, 0, 0, 0, W, H);
  ctx.save(); ctx.strokeStyle = 'rgba(35,36,39,.07)'; ctx.lineWidth = 3; for (let x = 60; x < W; x += 90) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); } ctx.restore();
  const m = eio(seg(t, 1.5, 2.7)), SH = 148;
  for (let i = 0; i < 13; i++) {
    const dark = i % 2 === 0, bi = i - 4, isBar = bi >= 0 && bi < 5;
    let cx = W / 2, cy = i * SH + SH / 2, w = W + 40, h = SH + 1, col = dark ? K : C1;
    if (isBar) { const b = BARS[bi]; cx = lerp(W / 2, b.x, m); cy = lerp(cy, 1250 - b.h / 2, m); w = lerp(w, b.w, m); h = lerp(h, b.h, m); if (m > .98) continue; }
    else { cx += (i % 2 ? 1 : -1) * eio(seg(t, 1.3 + (i % 5) * .08, 2.3 + (i % 5) * .08)) * (W + 200); }
    rect(col, 1.2, cx - w / 2, cy - h / 2, w, h, m > .4 && isBar ? 8 : 0);
    if (m < .3) { ctx.save(); ctx.globalAlpha = 1 - m / .3; ctx.strokeStyle = dark ? 'rgba(243,235,218,.10)' : 'rgba(35,36,39,.10)'; ctx.lineWidth = 3; for (let x = (i % 2) * 110; x < W; x += 220) { ctx.beginPath(); ctx.moveTo(x, cy - h / 2); ctx.lineTo(x, cy + h / 2); ctx.stroke(); } ctx.restore(); }
  }
  if (m > .98) { const blink = Math.sin(t * 9) > 0 ? 1 : 0; bars(1250, blink, t); label('إشارة ضعيفة', 540, 1340, 44, K3, 500, BODY); }
  tag('بحمص…', 470, t, .5, 3.7, { dark: m < .5, size: 84 }); tag('كل شي إلو أصل', 600, t, .95, 3.7, { dark: m < .5, size: 72, rot: 1.2 });
}

// ================= 2 — the New Clock square (4–10 waiting, 13.5–16 alive) =================
function square(u, alive) {
  const zoomIn = alive ? lerp(1.45, 1, eio(seg(u, 0, 1.6))) : lerp(1, 1.55, eio(seg(u, 2.4, 4.6)));
  rect(C1, 0, 0, 0, W, H);
  ctx.save(); ctx.translate(540, 980); ctx.scale(zoomIn, zoomIn); ctx.translate(-540 + Math.sin(u * .5) * 8, -760);
  circ(C2, 1, 830, 620, 120);
  // far skyline
  const r = rng(11); for (let x = -40; x < W + 40;) { const w = 70 + r() * 90, h = 150 + r() * 220; rect(C3, .6, x, 1260 - h, w, h + 400); if (r() < .3) dome(x + w / 2, 1260 - h, w * .3, C3, .5); x += w + 6; }
  minaret(160, 1260, 520, C3, .6); minaret(930, 1260, 470, C3, .6);
  // mid buildings
  for (const [x, w, h, s] of [[-30, 250, 520, 3], [800, 320, 600, 5], [230, 150, 380, 7], [690, 130, 340, 9]]) {
    rect(C2, 1.2, x, 1400 - h, w, h + 300); const rr2 = rng(s);
    for (let yy = 1400 - h + 40; yy < 1340; yy += 84) for (let xx = x + 26; xx < x + w - 50; xx += 74) { const lit = alive && rr2() < .5; rect(lit ? G : K2, .3, xx, yy, 40, 52, 4); }
  }
  // road + roundabout
  rect(K2, 0, -200, 1420, W + 400, 700);
  ctx.save(); ctx.strokeStyle = C3; ctx.lineWidth = 6; ctx.setLineDash([40, 34]); ctx.beginPath(); ctx.ellipse(540, 1560, 470, 120, 0, 0, 7); ctx.stroke(); ctx.restore();
  paper(C2, 1.4, () => ctx.ellipse(540, 1520, 300, 74, 0, 0, 7)); paper(C3, 0, () => ctx.ellipse(540, 1512, 250, 54, 0, 0, 7));
  tree(330, 1510, 1); tree(750, 1510, 1.1); tree(420, 1540, .8); tree(670, 1545, .85);
  if (alive) { ctx.save(); for (let k = 0; k < 3; k++) { const q = (u * .7 + k / 3) % 1; ctx.strokeStyle = G; ctx.globalAlpha = (1 - q) * .8; ctx.lineWidth = 14; ctx.beginPath(); ctx.arc(540, 688, 130 + q * 330, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); } ctx.restore(); }
  // the clock tower
  rect(C2, 1.5, 420, 1410, 240, 100, 6); rect(C1, 1, 440, 1380, 200, 40, 4);
  ablaq(465, 800, 150, 600, 10, 1.4);
  rect(K, 1.6, 410, 556, 260, 262, 8); rect(C1, .6, 424, 570, 232, 234, 4);
  paper(K, 1.4, () => { ctx.moveTo(410, 560); ctx.lineTo(540, 450); ctx.lineTo(670, 560); ctx.closePath(); }); rect(K, .5, 535, 410, 10, 50); circ(K, .5, 540, 404, 10);
  const fx = 540, fy = 688; circ(K, .6, fx, fy, 100); circ('#FBF7EC', 0, fx, fy, 88);
  if (!alive) {       // hands replaced by a loading spinner
    for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283 + Math.floor(u * 10) / 12 * 6.283; ctx.save(); ctx.globalAlpha = .12 + .88 * i / 12; ctx.strokeStyle = K; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(fx + Math.cos(a) * 34, fy + Math.sin(a) * 34); ctx.lineTo(fx + Math.cos(a) * 68, fy + Math.sin(a) * 68); ctx.stroke(); ctx.restore(); }
  } else {
    ctx.save(); ctx.strokeStyle = K; ctx.lineWidth = 4; for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; ctx.beginPath(); ctx.moveTo(fx + Math.cos(a) * 70, fy + Math.sin(a) * 70); ctx.lineTo(fx + Math.cos(a) * 80, fy + Math.sin(a) * 80); ctx.stroke(); }
    const hand = (a, l, w, c) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx + Math.sin(a) * l, fy - Math.cos(a) * l); ctx.stroke(); };
    hand(1.05, 42, 11, K); hand(u * 2.6 + 3.3, 64, 8, K); hand(Math.floor(u * 4) / 4 * 6.283 / 3, 72, 4, G2); ctx.restore(); circ(G, 0, fx, fy, 9);
  }
  // people, cars, pigeons
  const bob = alive ? Math.abs(Math.sin(u * 7)) * -8 : 0;
  person(200, 1640, 1.25, K, C3, bob); person(270, 1650, 1.05, K3, C2, alive ? Math.abs(Math.sin(u * 7 + 1)) * -8 : 0); person(880, 1660, 1.3, K, C3, alive ? Math.abs(Math.sin(u * 7 + 2)) * -8 : 0);
  if (!alive) { const bx = 235, by = 1420; rect(C1, 1.2, bx - 62, by - 40, 124, 70, 30); paper(C1, 0, () => { ctx.moveTo(bx - 14, by + 26); ctx.lineTo(bx - 26, by + 56); ctx.lineTo(bx + 10, by + 28); ctx.closePath(); }); for (let k = 0; k < 3; k++) circ(Math.floor(u * 2.5) % 3 === k ? K : C4, 0, bx - 30 + k * 30, by - 5, 9); }
  const cm = alive ? u * 150 : 0;
  car(350 + cm * 1.2, 1700, 1.25, K); car(790 - cm, 1790, -1.45, K3); car(120 + cm * .8, 1860, 1.6, C3);
  const br = rng(21); for (let i = 0; i < 9; i++) { const x0 = 80 + br() * 920, y0 = 880 + br() * 420, s = .7 + br() * .7; bird(x0 + (alive ? (u * (90 + br() * 120)) : 0), y0 - (alive ? u * 60 * br() : 0), s, alive ? Math.sin(u * 14 + i) : .9, i % 3 ? K2 : K3); }
  ctx.restore();
}
function s2(t) { square(t - 4, false); tag('…إلا النت', 450, t, 4.5, 9.6, { size: 78, dark: true }); tag('كان ناطر', 568, t, 5.0, 9.6, { size: 72, rot: 1.4 }); }
function s3b(t) { square(t - 13.5, true); tag('من قلب حمص', 480, t, 13.8, 15.75, { size: 92, green: true }); }

// ================= 3 — the ablaq arch lights up into Wi-Fi (10–13.5) =================
function s3(t) {
  const u = t - 10, z = lerp(1.12, 1, eout(seg(u, 0, 1.2)));
  rect(C2, 0, 0, 0, W, H);
  ctx.save(); ctx.translate(540, 1100); ctx.scale(z, z); ctx.translate(-540, -1100);
  // mosque behind
  rect(C3, .8, 120, 1180, 840, 500); dome(540, 1180, 190, C3, .8); dome(260, 1180, 90, C3, .6); dome(820, 1180, 90, C3, .6); minaret(100, 1700, 900, C3, .8); minaret(980, 1700, 900, C3, .8);
  // wall with the arch opening
  const cx = 540, cy = 1210;
  paper(C1, 2, () => { ctx.rect(-40, 560, W + 80, 1500); ctx.moveTo(cx - 230, 1990); ctx.lineTo(cx - 230, cy); ctx.arc(cx, cy, 230, Math.PI, 0); ctx.lineTo(cx + 230, 1990); ctx.closePath(); }); ctx.fillStyle = C1;
  // re-cut the opening (even-odd)
  ctx.save(); ctx.beginPath(); ctx.moveTo(cx - 230, 2000); ctx.lineTo(cx - 230, cy); ctx.arc(cx, cy, 230, Math.PI, 0); ctx.lineTo(cx + 230, 2000); ctx.closePath(); ctx.clip();
  rect(K2, 0, 0, 0, W, H); rect(K, 0, cx - 150, cy + 120, 300, 900); for (let k = 0; k < 4; k++) rect(K3, 0, cx - 230, cy + 260 + k * 150, 460, 8);
  ctx.strokeStyle = C4; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx, cy - 230); ctx.lineTo(cx, cy - 20); ctx.stroke();
  ctx.restore();
  // three nested voussoir bands
  for (let k = 2; k >= 0; k--) {
    const r0 = 240 + k * 96, r1 = r0 + 84, on = eout(seg(u, .8 + k * .65, 1.15 + k * .65)), n = 9 + k * 2;
    for (let i = 0; i < n; i++) { const a0 = Math.PI + i / n * Math.PI, a1 = Math.PI + (i + 1) / n * Math.PI; const base = i % 2 ? C1 : K, lit = i % 2 ? GL : G; paper(on > .5 ? lit : base, 1, () => { ctx.arc(cx, cy, r1, a0, a1); ctx.arc(cx, cy, r0, a1, a0, true); ctx.closePath(); }); }
    for (const sx of [-1, 1]) ablaq(sx < 0 ? cx - r1 : cx + r0, cy, r1 - r0, 800, 9, .8, on > .5 ? G : K, on > .5 ? GL : C1);
  }
  // the hanging lamp is the Wi-Fi dot
  const lampOn = seg(u, .4, .7); circ(lampOn > .5 ? G : C3, 1.2, cx, cy - 10, 30); if (lampOn > .5) { ctx.save(); const g = ctx.createRadialGradient(cx, cy - 10, 10, cx, cy - 10, 220); g.addColorStop(0, 'rgba(184,240,143,.55)'); g.addColorStop(1, 'rgba(184,240,143,0)'); ctx.fillStyle = g; ctx.fillRect(cx - 220, cy - 230, 440, 440); ctx.restore(); }
  ctx.restore();
  // sticker: it IS a Wi-Fi symbol
  const st = eback(seg(u, 2.5, 2.95)); if (st > 0) { ctx.save(); ctx.translate(850, 800); ctx.rotate(.14); ctx.scale(st, st); circ(C1, 2, 0, -40, 150); wifi(0, 30, .78, 3); ctx.restore(); }
  tag('لهيك جبنالك ياه', 500, t, 10.5, 13.2, { size: 80, dark: true });
}

// ================= 4 — the courtyard house (16–22) =================
function s4(t) {
  const u = t - 16, pan = Math.sin(u * .45) * 14;
  rect(C2, 0, 0, 0, W, H);
  ctx.save(); ctx.translate(pan, 0);
  // sky strip + roof with antenna
  rect(C1, 0, -60, 0, W + 120, 760);
  circ(C2, .8, 190, 640, 70);
  const TH = [[1210, 560], [1080, 420], [905, 696]];
  rect(C3, 1, -60, 740, W + 120, 60); ablaq(-60, 800, W + 120, 60, 2, .8);
  antenna(900, 690, 1.0, seg(u, .9, 1.1));
  // back wall
  rect(C1, 1.4, -60, 860, W + 120, 1100);
  // iwan (big arch) with ablaq frame

const CUTS = [4, 10, 13.5, 16, 22, 28];

function scene(t) { if (t < 4) s1(t); else if (t < 10) s2(t); else if (t < 13.5) s3(t); else if (t < 16) s3b(t); else if (t < 22) s4(t); else if (t < 28) s5(t); else s6(t); }
function render(t) {
  ctx.save(); ctx.clearRect(0, 0, W, H); scene(t); wipe(t); logoBadge(t);

  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .34; for (let x = 0; x < W; x += 540) for (let y = 0; y < H; y += 540) ctx.drawImage(GRAIN, x, y); ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .8); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(20,12,4,.32)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

}
