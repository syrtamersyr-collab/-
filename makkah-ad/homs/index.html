<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>من قلب حمص — مركز مكة</title>

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// «من قلب حمص» — paper-theatre film for Makkah Technologies. 1080x1920, 35s.
// The black-and-white ablaq stone of Homs turns into signal bars and Wi-Fi arcs.
// Every frame comes from render(t).
const W = 1080, H = 1920, DUR = 35;
const K = '#232427', K2 = '#34363b', K3 = '#4a4d54', C1 = '#F3EBDA', C2 = '#E4D8BE', C3 = '#CDBF9F', C4 = '#B3A383', G = '#50BE1E', G2 = '#2F8F10', GL = '#B8F08F';
const DISPLAY = '"Readex Pro","IBM Plex Sans Arabic",sans-serif', BODY = '"IBM Plex Sans Arabic","Readex Pro",sans-serif';
const cv = document.getElementById('c'); let ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eout = p => 1 - Math.pow(1 - p, 3);
const eback = p => { const c1 = 1.7, c3 = c1 + 1; return Math.max(0, 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2)); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rrp(x, y, w, h, r) { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
// a piece of cut paper: filled shape with a soft drop shadow underneath
function paper(fill, depth, draw) {
  ctx.save(); if (depth > 0) { ctx.shadowColor = 'rgba(28,18,6,.42)'; ctx.shadowBlur = 9 * depth; ctx.shadowOffsetY = 6 * depth; ctx.shadowOffsetX = 2 * depth; }
  ctx.fillStyle = fill; ctx.beginPath(); draw(); ctx.fill(); ctx.restore();
}
const rect = (fill, d, x, y, w, h, r = 0) => paper(fill, d, () => r ? rrp(x, y, w, h, r) : ctx.rect(x, y, w, h));
const circ = (fill, d, x, y, r) => paper(fill, d, () => ctx.arc(x, y, r, 0, 7));
function label(text, x, y, size, col, weight = 700, font = DISPLAY, align = 'center', dir = 'rtl') { ctx.save(); ctx.font = `${weight} ${size}px ${font}`; ctx.direction = dir; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(text, x, y); ctx.restore(); }
// headline on a strip of paper
function tag(text, y, t, tin, tout, o = {}) {
  const p = eback(seg(t, tin, tin + .45)) * (1 - eio(seg(t, tout, tout + .3))); if (p <= 0.001) return;
  const size = o.size || 64; ctx.save(); ctx.font = `700 ${size}px ${DISPLAY}`; ctx.direction = 'rtl'; const w = ctx.measureText(text).width + size * 1.1, h = size * 1.62;
  ctx.translate(o.x || W / 2, y); ctx.rotate((o.rot ?? -1.6) * Math.PI / 180); ctx.scale(p, p);
  const bg = o.green ? G : o.dark ? K : C1, fg = o.green ? '#fff' : o.dark ? C1 : K;
  rect(bg, 1.6, -w / 2, -h / 2, w, h, 10);
  ctx.strokeStyle = o.green ? 'rgba(255,255,255,.35)' : o.dark ? 'rgba(243,235,218,.25)' : 'rgba(35,36,39,.18)'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]); ctx.beginPath(); rrp(-w / 2 + 9, -h / 2 + 9, w - 18, h - 18, 6); ctx.stroke(); ctx.setLineDash([]);
  label(text, 0, 3, size, fg); ctx.restore();
}
// ablaq: alternating basalt / limestone courses
function ablaq(x, y, w, h, n, d = 0, a = K, b = C1) { for (let i = 0; i < n; i++) rect(i % 2 ? b : a, d, x, y + i * h / n, w, h / n + .5); }
let GRAIN, LOGO;
function buildGrain() { GRAIN = mk(540, 540); const g = GRAIN.getContext('2d'); const d = g.createImageData(540, 540); const r = rng(5); for (let i = 0; i < d.data.length; i += 4) { const v = 150 + r() * 105; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); g.strokeStyle = 'rgba(90,70,40,.10)'; for (let i = 0; i < 260; i++) { g.lineWidth = r() * 1.2; g.beginPath(); const x = r() * 540, y = r() * 540, a = r() * 6.28, l = 6 + r() * 26; g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); } }

// ---------- little paper props ----------
function car(x, y, s, col) { ctx.save(); ctx.translate(x, y); ctx.scale(s, Math.abs(s)); paper(col, 1, () => { rrp(-70, -34, 140, 44, 12); ctx.moveTo(-40, -34); ctx.lineTo(-26, -62); ctx.lineTo(30, -62); ctx.lineTo(48, -34); ctx.closePath(); }); rect(C1, 0, -22, -56, 22, 20, 3); rect(C1, 0, 6, -56, 24, 20, 3); circ(K, .5, -40, 10, 15); circ(K, .5, 40, 10, 15); circ(C3, 0, -40, 10, 6); circ(C3, 0, 40, 10, 6); ctx.restore(); }
function bird(x, y, s, flap, col = K2) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); paper(col, .6, () => { ctx.ellipse(0, 0, 20, 9, 0, 0, 7); ctx.moveTo(14, -4); ctx.lineTo(30, -1); ctx.lineTo(14, 3); ctx.closePath(); }); paper(col, .5, () => { ctx.moveTo(-10, -2); ctx.quadraticCurveTo(-4, -34 * flap, 16, -22 * flap); ctx.lineTo(4, -2); ctx.closePath(); }); ctx.restore(); }
function person(x, y, s, col, head = C3, bob = 0) { ctx.save(); ctx.translate(x, y + bob); ctx.scale(s, s); paper(col, 1, () => { ctx.moveTo(-26, 0); ctx.quadraticCurveTo(-30, -92, 0, -96); ctx.quadraticCurveTo(30, -92, 26, 0); ctx.closePath(); }); circ(head, .8, 0, -122, 24); ctx.restore(); }
function tree(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); rect(K2, .5, -5, -50, 10, 50); circ(K3, 1, 0, -74, 34); circ(K2, .6, -14, -86, 20); ctx.restore(); }
function dome(x, y, r, col, d = 1) { paper(col, d, () => { ctx.moveTo(x - r, y); ctx.bezierCurveTo(x - r, y - r * .95, x - r * .25, y - r * 1.15, x, y - r * 1.4); ctx.bezierCurveTo(x + r * .25, y - r * 1.15, x + r, y - r * .95, x + r, y); ctx.closePath(); }); rect(col, 0, x - 3, y - r * 1.4 - 22, 6, 24); }
function minaret(x, base, h, col, d = 1) { rect(col, d, x - 16, base - h, 32, h); rect(col, d, x - 26, base - h * .72, 52, 14); paper(col, d, () => { ctx.moveTo(x - 18, base - h); ctx.lineTo(x, base - h - 90); ctx.lineTo(x + 18, base - h); ctx.closePath(); }); }
// rooftop antenna drawn from a photo: two perforated wings that flare at the outer edges, a solid centre plate,
// and a feed arm ending in a rounded box
function antenna(x, y, s, glow) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  rect(K2, .6, 6, 30, 10, 120, 3);
  paper('#F4F5F6', 1.3, () => { ctx.moveTo(-84, -48); ctx.quadraticCurveTo(-86, -64, -70, -63); ctx.quadraticCurveTo(-44, -60, -20, -55); ctx.lineTo(20, -55); ctx.quadraticCurveTo(44, -60, 70, -63); ctx.quadraticCurveTo(86, -64, 84, -48); ctx.quadraticCurveTo(78, 0, 84, 48); ctx.quadraticCurveTo(86, 64, 70, 63); ctx.quadraticCurveTo(44, 60, 20, 55); ctx.lineTo(-20, 55); ctx.quadraticCurveTo(-44, 60, -70, 63); ctx.quadraticCurveTo(-86, 64, -84, 48); ctx.quadraticCurveTo(-78, 0, -84, -48); ctx.closePath(); });
  ctx.fillStyle = '#AEB6BF'; for (let i = -72; i <= 72; i += 8) for (let j = -54; j <= 54; j += 8) { const ax = Math.abs(i); if (ax < 24) continue; const lim = 48 + (ax - 20) * .12; if (Math.abs(j) > lim) continue; ctx.beginPath(); ctx.arc(i, j, 1.5, 0, 7); ctx.fill(); }
  paper('#FFFFFF', .6, () => rrp(-21, -62, 42, 124, 8)); rect('#D5DAE0', 0, -5, -30, 10, 3, 1); rect('#D5DAE0', 0, -8, 22, 5, 3, 1); rect('#D5DAE0', 0, 3, 22, 5, 3, 1);
  ctx.save(); ctx.lineCap = 'round'; ctx.shadowColor = 'rgba(28,18,6,.35)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 3; ctx.strokeStyle = '#ECEEF0'; ctx.lineWidth = 22; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-44, 10); ctx.stroke(); ctx.restore();
  paper('#FFFFFF', 1, () => rrp(-76, -8, 36, 38, 10));
  if (glow > 0) { ctx.fillStyle = G; ctx.globalAlpha = glow; ctx.beginPath(); ctx.arc(-58, 11, 6, 0, 7); ctx.fill(); }
  ctx.restore(); }
function thread(pts, p, w = 9) { if (p <= 0) return; const n = Math.max(2, Math.round((pts.length - 1) * p) + 1); ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowColor = 'rgba(28,18,6,.35)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 4; ctx.strokeStyle = G; ctx.lineWidth = w; ctx.beginPath(); for (let i = 0; i < n; i++) i ? ctx.lineTo(pts[i][0], pts[i][1]) : ctx.moveTo(pts[i][0], pts[i][1]); ctx.stroke(); ctx.shadowColor = 'transparent'; ctx.strokeStyle = GL; ctx.lineWidth = w * .3; ctx.setLineDash([14, 12]); ctx.stroke(); ctx.restore(); }
function curve(a, c, b, n = 40) { const o = []; for (let i = 0; i <= n; i++) { const q = i / n; o.push([(1 - q) * (1 - q) * a[0] + 2 * (1 - q) * q * c[0] + q * q * b[0], (1 - q) * (1 - q) * a[1] + 2 * (1 - q) * q * c[1] + q * q * b[1]]); } return o; }
function wifi(x, y, s, lit, col = G) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); for (let i = 3; i >= 1; i--) { const on = lit >= i; ctx.save(); ctx.shadowColor = 'rgba(28,18,6,.38)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 5; ctx.strokeStyle = on ? col : C3; ctx.lineWidth = 26; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 0, i * 52, Math.PI * 1.22, Math.PI * 1.78); ctx.stroke(); ctx.restore(); } circ(lit >= 0 ? col : C3, 1, 0, 0, 20); ctx.restore(); }
const BARS = [0, 1, 2, 3, 4].map(i => ({ x: 300 + i * 120, w: 84, h: 130 + i * 92 }));
function bars(baseY, lit, t, alpha = 1, sc = 1, cx = 540) { ctx.save(); ctx.globalAlpha = alpha; ctx.translate(cx, baseY); ctx.scale(sc, sc); ctx.translate(-540, 0); BARS.forEach((b, i) => { const on = lit > i, pop = on ? 1 + .12 * Math.max(0, 1 - Math.abs(lit - i - .5) * 2) : 1; ctx.save(); ctx.translate(b.x, 0); ctx.scale(pop, pop); rect(on ? G : C3, 1.2, -b.w / 2, -b.h, b.w, b.h, 8); if (on) rect(GL, 0, -b.w / 2 + 10, -b.h + 10, 12, b.h - 20, 6); ctx.restore(); }); ctx.restore(); }


// ---------- Homs landmarks, drawn to their real silhouettes ----------
const SILVER = '#C4CAD1', SILVER2 = '#E9EDF1';
// New Clock (الساعة الجديدة), drawn from a photo: sloped stone platform with stairs, white cube base with
// black arched frames, slender shaft with VERTICAL black bands, wider head with a clock in a black frame.
const STONE = '#F1EADB', STONE2 = '#DDD3BE';
function homsClock(x, baseY, s, drawFace) {
  ctx.save(); ctx.translate(x, baseY); ctx.scale(s, s);
  // platform
  rect(STONE2, 1, -250, -14, 500, 18, 3);
  paper(C2, 1.4, () => { ctx.moveTo(-232, -14); ctx.lineTo(-118, -112); ctx.lineTo(118, -112); ctx.lineTo(232, -14); ctx.closePath(); });
  paper(STONE, 0, () => { ctx.moveTo(-70, -14); ctx.lineTo(-52, -112); ctx.lineTo(52, -112); ctx.lineTo(70, -14); ctx.closePath(); });
  ctx.strokeStyle = C4; ctx.lineWidth = 3; for (let k = 1; k < 7; k++) { const q = k / 7, y = -14 - q * 98; ctx.beginPath(); ctx.moveTo(lerp(-70, -52, q), y); ctx.lineTo(lerp(70, 52, q), y); ctx.stroke(); }
  // cube base: white stone, black corner strips, black arched frame with a grille
  rect(STONE, 1.4, -104, -322, 208, 212, 3); rect(STONE2, 0, -104, -322, 208, 10); rect(K, 0, -104, -312, 26, 202); rect(K, 0, 78, -312, 26, 202);
  paper(K, .5, () => { ctx.moveTo(-62, -110); ctx.lineTo(-62, -236); ctx.arc(0, -236, 62, Math.PI, 0); ctx.lineTo(62, -110); ctx.closePath(); });
  ctx.strokeStyle = STONE; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-42, -110); ctx.lineTo(-42, -232); ctx.arc(0, -232, 42, Math.PI, 0); ctx.lineTo(42, -110); ctx.stroke();
  ctx.strokeStyle = K3; ctx.lineWidth = 2.5; for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(k * 14, -114); ctx.lineTo(k * 14, -262); ctx.stroke(); } for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.moveTo(-38, -126 - k * 26); ctx.lineTo(38, -126 - k * 26); ctx.stroke(); }
  rect(STONE, 1, -84, -344, 168, 24, 3);
  // shaft with vertical black bands and a long recessed slot
  rect(STONE, 1.4, -62, -790, 124, 448, 2); rect(K, 0, -62, -790, 20, 448); rect(K, 0, 42, -790, 20, 448);
  rect(K2, 0, -11, -760, 22, 330, 6); ctx.strokeStyle = C4; ctx.lineWidth = 2; for (let k = 0; k < 16; k++) { ctx.beginPath(); ctx.moveTo(-8, -748 + k * 20); ctx.lineTo(8, -748 + k * 20); ctx.stroke(); }
  circ(K, 0, 0, -392, 15); circ(STONE, 0, 0, -392, 9);
  // head: flares out, clock set in a black frame
  paper(STONE, 1, () => { ctx.moveTo(-62, -790); ctx.lineTo(-96, -826); ctx.lineTo(96, -826); ctx.lineTo(62, -790); ctx.closePath(); });
  paper(STONE, 1.5, () => { ctx.moveTo(-96, -826); ctx.lineTo(-96, -990); ctx.lineTo(-80, -1008); ctx.lineTo(80, -1008); ctx.lineTo(96, -990); ctx.lineTo(96, -826); ctx.closePath(); });
  paper(K, .5, () => rrp(-78, -996, 156, 160, 20));
  circ(STONE2, 0, 0, -916, 66); circ('#FBF7EC', 0, 0, -916, 58);
  if (drawFace) drawFace(0, -916, 58); else { ctx.strokeStyle = K; ctx.lineWidth = 3.5; for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 44, -916 + Math.sin(a) * 44); ctx.lineTo(Math.cos(a) * 52, -916 + Math.sin(a) * 52); ctx.stroke(); } ctx.lineCap = 'round'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(0, -916); ctx.lineTo(24, -930); ctx.stroke(); ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(0, -916); ctx.lineTo(-6, -958); ctx.stroke(); }
  rect(STONE2, .6, -84, -1014, 168, 10, 3); rect(K3, 0, -1.5, -1080, 3, 68);
  ctx.restore();
}
// Khalid ibn al-Walid mosque, drawn from a photo: dark basalt walls with thin white courses, arched windows in
// white surrounds, silver domes on dark drums, pale stone minarets with a balcony and a small rounded cap.
const BASALT = '#55585f', BASALT2 = '#3f4248';
function khalidMosque(x, baseY, s, tone = 1) {
  const wall = tone ? BASALT : C4, wall2 = tone ? BASALT2 : C4, st = tone ? STONE : C2, sil = tone ? SILVER : C3, sil2 = tone ? SILVER2 : C2, ink = tone ? K : C4;
  ctx.save(); ctx.translate(x, baseY); ctx.scale(s, s);
  const sDome = (dx, y, r, k = 1) => { paper(sil, 1.2, () => { ctx.moveTo(dx - r, y); ctx.bezierCurveTo(dx - r, y - r * .78 * k, dx - r * .55, y - r * 1.06 * k, dx, y - r * 1.08 * k); ctx.bezierCurveTo(dx + r * .55, y - r * 1.06 * k, dx + r, y - r * .78 * k, dx + r, y); ctx.closePath(); }); paper(sil2, 0, () => ctx.ellipse(dx - r * .36, y - r * .6 * k, r * .14, r * .32 * k, .55, 0, 7)); rect(ink, 0, dx - 2, y - r * 1.08 * k - 22, 4, 24); circ(ink, 0, dx, y - r * 1.08 * k - 26, 4.5); };
  const drum = (dx, y, w, h, n) => { rect(wall2, .8, dx - w / 2, y - h, w, h, 2); rect(st, 0, dx - w / 2 - 4, y - h - 6, w + 8, 8, 2); for (let k = 0; k < n; k++) { const wx = dx - w / 2 + (k + .5) * w / n; paper(ink, 0, () => { ctx.moveTo(wx - 7, y - 8); ctx.lineTo(wx - 7, y - h * .55); ctx.arc(wx, y - h * .55, 7, Math.PI, 0); ctx.lineTo(wx + 7, y - 8); ctx.closePath(); }); } };
  // minarets (pale stone, balcony, rounded cap)
  for (const sx of [-1, 1]) { const mx = sx * 392;
    rect(st, 1, mx - 38, -330, 76, 330, 2);
    rect(st, 1.2, mx - 25, -850, 50, 524, 2); ctx.strokeStyle = tone ? STONE2 : C3; ctx.lineWidth = 2; for (let k = 0; k < 16; k++) { ctx.beginPath(); ctx.moveTo(mx - 25, -350 - k * 31); ctx.lineTo(mx + 25, -350 - k * 31); ctx.stroke(); }
    paper(st, 1, () => { ctx.moveTo(mx - 25, -850); ctx.lineTo(mx - 44, -888); ctx.lineTo(mx + 44, -888); ctx.lineTo(mx + 25, -850); ctx.closePath(); });
    rect(st, .8, mx - 46, -918, 92, 32, 3); ctx.strokeStyle = ink; ctx.lineWidth = 2; for (let k = -4; k <= 4; k++) { ctx.beginPath(); ctx.moveTo(mx + k * 10, -914); ctx.lineTo(mx + k * 10, -890); ctx.stroke(); }
    rect(st, .8, mx - 18, -1010, 36, 94, 2); paper(st, .6, () => { ctx.moveTo(mx - 18, -1010); ctx.lineTo(mx - 26, -1026); ctx.lineTo(mx + 26, -1026); ctx.lineTo(mx + 18, -1010); ctx.closePath(); });
    rect(st, .5, mx - 13, -1058, 26, 34, 2);
    paper(tone ? SILVER2 : C2, .8, () => { ctx.moveTo(mx - 15, -1058); ctx.bezierCurveTo(mx - 24, -1092, mx - 6, -1108, mx, -1120); ctx.bezierCurveTo(mx + 6, -1108, mx + 24, -1092, mx + 15, -1058); ctx.closePath(); });
    rect(ink, 0, mx - 1.5, -1146, 3, 28); circ(ink, 0, mx, -1150, 4); }
  // upper tier, drums and domes
  rect(wall2, 1, -250, -388, 500, 92, 2); rect(st, 0, -256, -394, 512, 9, 2);
  drum(-236, -330, 150, 46, 5); sDome(-236, -376, 72); drum(236, -330, 150, 46, 5); sDome(236, -376, 72);
  drum(0, -388, 236, 70, 7); sDome(0, -458, 132, 1.02);
  sDome(0, -330, 150, .62);
  // main block: basalt with thin white courses, white piers and cornice
  rect(wall, 1.5, -330, -330, 660, 330, 2);
  ctx.strokeStyle = tone ? 'rgba(241,234,219,.42)' : 'rgba(255,255,255,.2)'; ctx.lineWidth = 2; for (let k = 1; k < 13; k++) { ctx.beginPath(); ctx.moveTo(-330, -k * 25.4); ctx.lineTo(330, -k * 25.4); ctx.stroke(); }
  for (const px of [-330, -118, 94, 306]) rect(st, .4, px, -330, 24, 330);
  rect(st, .8, -340, -344, 680, 18, 2); rect(st, 0, -330, -178, 660, 9); rect(st, .5, -340, -10, 680, 14, 2);
  const win = (wx, wy, w, h) => { paper(st, .3, () => { ctx.moveTo(wx - w / 2 - 8, wy); ctx.lineTo(wx - w / 2 - 8, wy - h); ctx.arc(wx, wy - h, w / 2 + 8, Math.PI, 0); ctx.lineTo(wx + w / 2 + 8, wy); ctx.closePath(); }); paper(ink, 0, () => { ctx.moveTo(wx - w / 2, wy); ctx.lineTo(wx - w / 2, wy - h); ctx.arc(wx, wy - h, w / 2, Math.PI, 0); ctx.lineTo(wx + w / 2, wy); ctx.closePath(); }); };
  for (const wx of [-262, -186, -62, 38, 162, 248]) { win(wx, -214, 26, 62); win(wx, -44, 26, 78); }
  // entrance porch with its own small dome
  rect(st, 1.2, 196, -168, 150, 168, 2); rect(wall, 0, 208, -156, 126, 156); sDome(271, -172, 46, .9); win(271, -14, 44, 92);
  ctx.restore();
}
function renderSheet() {
  ctx.save(); ctx.clearRect(0, 0, W, H); rect(C1, 0, 0, 0, W, H);
  label('الساعة الجديدة', 540, 110, 64, K); homsClock(540, 950, .72);
  rect(C3, 0, 80, 1010, 920, 4);
  label('جامع خالد بن الوليد', 540, 1070, 64, K); khalidMosque(540, 1870, .66);
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .3; for (let x = 0; x < W; x += 540) for (let y = 0; y < H; y += 540) ctx.drawImage(GRAIN, x, y); ctx.restore(); ctx.restore();
}
// ================= 1 — ablaq wall becomes signal bars (0–4) =================
function s1(t) {
  rect(C1, 0, 0, 0, W, H);
  ctx.save(); ctx.strokeStyle = 'rgba(35,36,39,.07)'; ctx.lineWidth = 3; for (let x = 60; x < W; x += 90) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); } ctx.restore();
  const m = eio(seg(t, 1.5, 2.7)), SH = 148;
  for (let i = 0; i < 13; i++) {
    const dark = i % 2 === 0, bi = i - 4, isBar = bi >= 0 && bi < 5;

      ctx.save(); ctx.translate(sg.kind === 'cam' ? -14 : 0, sg.kind === 'cam' ? -68 : -108); icon(sg.kind, sg.kind === 'cam' ? .78 : 1.1); ctx.restore(); rect(G, .6, -190, 44, 380, 96, 14); label(sg.text, 0, 94, 54, '#fff');
    }
    ctx.restore();
  }
  // floor sheen + skylight beams
  ctx.save(); ctx.globalAlpha = .13; ctx.fillStyle = C1; for (let k = 0; k < 3; k++) { const x = 220 + k * 320 + Math.sin(u * .6 + k) * 30; ctx.beginPath(); ctx.moveTo(x - 40, 0); ctx.lineTo(x + 40, 0); ctx.lineTo(x + 240, H); ctx.lineTo(x - 80, H); ctx.closePath(); ctx.fill(); } ctx.restore();
  tag('وكل شي بيلزمك', 480, t, 22.4, 27.6, { size: 78 });
}

// ================= 6 — the shop + full signal + sign-off (28–35) =================
function s6(t) {
  const u = t - 28; rect(C1, 0, 0, 0, W, H);
  ablaq(0, 0, W, 190, 2, 1.2); ablaq(0, 1650, W, 270, 3, 1.2);
  const out = eio(seg(u, 2.6, 3.3));
  ctx.save(); ctx.translate(0, out * 1500); ctx.globalAlpha = 1 - seg(u, 2.9, 3.3);
  // shop
  rect(C2, 1.6, 150, 1010, 780, 600); ablaq(150, 1010, 780, 60, 2, .8);
  rect(K, 1.4, 190, 1090, 700, 130, 10); label('مركز مكة للتقنيات', 590, 1158, 62, C1); circ('#fff', .6, 268, 1155, 50); ctx.drawImage(LOGO, 218, 1105, 100, 100);
  for (let k = 0; k < 7; k++) paper(k % 2 ? '#fff' : G, 1.2, () => { const x = 170 + k * 106; ctx.moveTo(x, 1230); ctx.lineTo(x + 106, 1230); ctx.lineTo(x + 106, 1300); ctx.arc(x + 53, 1300, 53, 0, Math.PI); ctx.closePath(); });
  rect(K, .8, 210, 1370, 380, 240, 6); rect('#DDE9E0', 0, 222, 1382, 356, 216, 3); rect(K, .8, 650, 1350, 200, 262, 6); rect('#DDE9E0', 0, 662, 1362, 176, 250, 3); circ(G, .3, 680, 1490, 8);
  antenna(800, 930, .9, 1);
  bars(900, clamp(u / .34 - 1.6, 0, 5), t, 1, .78);
  ctx.restore();
  tag('إشارة كاملة', 480, t, 28.6, 30.5, { size: 84, green: true });
  // sign-off
  const pp = eback(seg(u, 3.9, 4.4));
  tag('مركز مكة للتقنيات', 900, t, 31.5, 99, { size: 82, dark: true, rot: -1 });
  tag('من قلب حمص… لكل حمص', 1030, t, 31.95, 99, { size: 62, green: true, rot: 1 });
  if (pp > 0) { ctx.save(); ctx.translate(540, 1200); ctx.scale(lerp(.8, 1, pp), lerp(.8, 1, pp)); ctx.globalAlpha = clamp(pp); rect('#fff', 2, -380, -64, 760, 128, 64); circ(G, .5, -300, 0, 44); ctx.strokeStyle = '#fff'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(-300, 0, 19, Math.PI * .6, Math.PI * 1.45); ctx.stroke(); label('0982 621 531', 50, 4, 76, K, 700, BODY, 'center', 'ltr'); ctx.restore(); }
  const a1 = seg(u, 4.6, 5.0); ctx.save(); ctx.globalAlpha = a1; label('حمص – القصور – خلف جامع حمود الناصر', 540, 1330, 40, K, 500, BODY); ctx.restore();
  const a2 = eback(seg(u, 5.1, 5.5)); if (a2 > 0) { ctx.save(); ctx.translate(540, 1430); ctx.scale(a2, a2); rect(K, 1.4, -330, -44, 660, 88, 44); label('اكتب نقطة (.) بالتعليقات', 0, 3, 42, C1); ctx.restore(); }
}

// ---------- the logo is on screen the whole time ----------
function logoBadge(t) {
  const u = t - 28, big = eio(seg(u, 2.9, 3.7)), inP = eback(seg(t, .15, .65));
  const x = 540, y = lerp(300, 620, big), r = lerp(66, 205, big) * inP; if (r <= 0) return;
  circ(K, 2, x, y, r + lerp(9, 16, big)); circ(G, 0, x, y, r + lerp(4, 8, big)); circ('#fff', 0, x, y, r); ctx.drawImage(LOGO, x - r, y - r, 2 * r, 2 * r);
}
// paper sheet wipe between scenes
const CUTS = [4, 10, 13.5, 16, 22, 28];
function wipe(t) { for (const c of CUTS) { const p = seg(t, c - .28, c + .28); if (p > 0 && p < 1) { const y = lerp(H + 80, -H - 260, eio(p)); ctx.save(); ctx.translate(0, y); paper(K, 3, () => { ctx.moveTo(0, 0); for (let x = 0; x <= W; x += 90) ctx.arc(x + 45, 0, 45, Math.PI, 0); ctx.lineTo(W, H + 180); for (let x = W; x >= 0; x -= 90) ctx.arc(x - 45, H + 180, 45, 0, Math.PI); ctx.closePath(); }); rect(G, 0, 0, 120, W, 26); rect(C1, 0, 0, 170, W, 12); rect(C1, 0, 0, H + 30, W, 12); rect(G, 0, 0, H + 60, W, 26); ctx.restore(); } } }
function scene(t) { if (t < 4) s1(t); else if (t < 10) s2(t); else if (t < 13.5) s3(t); else if (t < 16) s3b(t); else if (t < 22) s4(t); else if (t < 28) s5(t); else s6(t); }
function render(t) {
  if (t < 0) return renderSheet();
  ctx.save(); ctx.clearRect(0, 0, W, H); scene(t); wipe(t); logoBadge(t);
  // paper grain + soft vignette
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .34; for (let x = 0; x < W; x += 540) for (let y = 0; y < H; y += 540) ctx.drawImage(GRAIN, x, y); ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .8); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(20,12,4,.32)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  if (t > DUR - .4) { ctx.fillStyle = `rgba(20,14,8,${seg(t, DUR - .4, DUR) * .5})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}
window.ready = (async () => {
  LOGO = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = 'assets/logo.webp'; });
  const probe = 'مكة abc 0.9… #:-%';
  await Promise.all(['400 80px "Readex Pro"', '700 80px "Readex Pro"', '500 40px "IBM Plex Sans Arabic"', '700 40px "IBM Plex Sans Arabic"'].map(f => document.fonts.load(f, probe)));
  buildGrain(); for (const tt of [1, 6, 11, 14, 18, 24, 33]) render(tt); await document.fonts.ready; return true;
})();
window.render = render;
</script>
