// ---------- stone textures ----------

// ---------- the stones ----------
const N = 120, BLK = new RoundedBoxGeometry(1, .5, .5, 3, .045);
const R = rng(7), blocks = [];

}
blocks[0].type = 0;
const Q = (x, y, z) => new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z));

const scatterP = blocks.map((b, i) => { if (i === 0) return V(0, 0, 0); let p; do { p = V((R() - .5) * 16, R() * 10 - 2.5, -R() * 12 + 2.5); } while (p.z > -1.5 && Math.abs(p.x) < 2.5 && Math.abs(p.y) < 2.2); return p; });
const scatterQ = blocks.map((b, i) => i === 0 ? Q(.12, -.5, .06) : Q(R() * 6, R() * 6, R() * 6));

// 1) ablaq wall with an arch
const wallSlots = [];
for (let c = 0; c < 16; c++) for (let k = 0; k < 8; k++) {
  const x = (k - 3.5) * 1.03 + (c % 2 ? .5 : 0) - .25, y = 1.1 + c * .52;
  const inArch = Math.abs(x) < 1.3 && (y < 4.6 || (y - 4.6) ** 2 + x * x < 1.3 * 1.3);

const fWall = (i, t) => wallMap[i] || fPark(i, t);
// 2) tower swarm: stones dive into the tower volume and vanish (the tower builds itself)
const fTower = (i, t) => { const b = blocks[i]; return { p: V((b.r1 - .5) * 1.2, .5 + b.r2 * 9, (b.r3 - .5) * 1.2), q: Q(b.r1 * 3, b.r2 * 3, 0), s: ZERO }; };
// 3) wifi arcs (centre 0,4)
const wifiSlots = [{ p: V(0, 2.2, 0), q: Q(0, 0, 0), s: V(.55, 1.1, 1) }];
for (const [r, n] of [[1.35, 4], [2.35, 7], [3.35, 10]]) for (let k = 0; k < n; k++) { const a = lerp(.72, Math.PI - .72, n === 1 ? .5 : k / (n - 1)); wifiSlots.push({ p: V(Math.cos(a) * r, 2.2 + Math.sin(a) * r, 0), q: Q(0, 0, a - Math.PI / 2), s: V(.6, 1, 1) }); }

// 4) solar panel: basalt tiles (5x4) tilted to the sky
const solarSlots = [], tilt = Q(-1.05, 0, 0);
for (let r = 0; r < 4; r++) for (let k = 0; k < 5; k++) { const lp = V((k - 2) * 1.17, 0, (r - 1.5) * 1.62).applyQuaternion(tilt).add(V(0, 3.6, 0)); solarSlots.push({ p: lp, q: tilt.clone(), s: V(1.12, .28, 3.1), type: 0 }); }

const monoSlots = [];
for (let c = 0; c < 13; c++) for (let k = 0; k < 7; k++) monoSlots.push({ p: V((k - 3) * 1.02 + (c % 2 ? .25 : -.25), 2.3 + c * .51, -.7), q: Q(0, 0, 0), s: ONE, type: c % 2 });

const _q = new THREE.Quaternion();
function blockAt(i, t) {

// ---------- the New Clock tower (white limestone, black inlays, clock faces) ----------
const clip = new THREE.Plane(V(0, -1, 0), 0);

const tower = new THREE.Group(); scene.add(tower);
const box = (w, h, d, mat, x, y, z, parent = tower) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };
box(4.6, .3, 4.6, twMat, 0, .15, 0); box(3.9, .3, 3.9, twMat, 0, .45, 0);
box(2.6, 2.3, 2.6, twMat, 0, 1.75, 0);

box(1.3, 6.1, 1.3, twMat, 0, 5.95, 0);                 // shaft
box(1.75, .28, 1.75, twMat, 0, 9.1, 0);                // capital

// ---------- engraved logo plate ----------

// text revealed right->left with a soft edge, gold gradient and glow

}
function badge(a) {

  ui.save(); ui.globalAlpha = a; ui.shadowColor = 'rgba(0,0,0,.6)'; ui.shadowBlur = 24; ui.fillStyle = '#f6efe2';
  const x = W - w - 58, y = 34; rrect(x, y, w + 28, h + 24, 18); ui.fill(); ui.shadowColor = 'transparent';
  ui.strokeStyle = '#c99a4c'; ui.lineWidth = 2.5; rrect(x + 5, y + 5, w + 18, h + 14, 14); ui.stroke();
  ui.drawImage(LOGO, x + 14, y + 12, w, h); ui.restore();
}
function rrect(x, y, w, h, r) { ui.beginPath(); ui.moveTo(x + r, y); ui.arcTo(x + w, y, x + w, y + h, r); ui.arcTo(x + w, y + h, x, y + h, r); ui.arcTo(x, y + h, x, y, r); ui.arcTo(x, y, x + w, y, r); ui.closePath(); }
function overlay(t) {

  const fb = eout(seg(t, 31.8, 33.0)); if (fb > 0) { const g2 = ui.createLinearGradient(0, 1180, 0, 1400); g2.addColorStop(0, 'rgba(6,4,2,0)'); g2.addColorStop(1, `rgba(6,4,2,${.9 * fb})`); ui.fillStyle = g2; ui.fillRect(0, 1180, W, 220); ui.fillStyle = `rgba(6,4,2,${.9 * fb})`; ui.fillRect(0, 1400, W, H - 1400); }
  // act 1

  // services

  // signature

  goldText('نورٌ من قلب حمص', 1440, 56, AMI, t, 32.9, 40, { w: 400, col: '#efe3c8' });
  const pp = eout(seg(t, 33.4, 34.2)); if (pp > 0) {
    ui.save(); ui.globalAlpha = pp; const pw = 640, ph = 118, y = 1575 + (1 - pp) * 20;
    ui.shadowColor = 'rgba(255,180,80,.45)'; ui.shadowBlur = 30; ui.strokeStyle = '#d9a955'; ui.lineWidth = 4; rrect(W / 2 - pw / 2, y - ph / 2, pw, ph, ph / 2); ui.stroke();
    ui.shadowBlur = 0; ui.fillStyle = 'rgba(20,14,6,.55)'; rrect(W / 2 - pw / 2 + 6, y - ph / 2 + 6, pw - 12, ph - 12, ph / 2 - 6); ui.fill();
    ui.font = `700 74px ${AMI}`; ui.direction = 'ltr'; ui.textAlign = 'center'; ui.textBaseline = 'middle'; ui.fillStyle = goldFill(ui, y, 74); ui.fillText('0982 621 531', W / 2, y + 4); ui.restore();
  }
  goldText('حمص – القصور – خلف جامع حمود الناصر', 1710, 50, AMI, t, 34.0, 40, { w: 400, col: '#efe3c8', dur: 1.0 });
  goldText('إنترنت · طاقة شمسية · كاميرات · تكييف · متابعة', 1800, 42, AMI, t, 34.5, 40, { w: 400, col: '#cbb48a', dur: 1.0 });
  badge(seg(t, .6, 1.6));

}

// ---------- frame ----------
function render(t) {
  const [cp, ct] = camAt(t); cam.position.copy(cp); cam.lookAt(ct);
  keyT.position.copy(ct); key.position.set(ct.x + 5, ct.y + 12, ct.z + 9); fill.position.set(ct.x - 3, ct.y - 1, ct.z + 5);
  for (let i = 0; i < N; i++) {
    const st = blockAt(i, t), b = blocks[i]; b.m.position.copy(st.p); b.m.quaternion.copy(st.q); b.m.scale.copy(st.s); b.m.visible = st.s.x > .01;
    const [rv, gi] = veinAt(i, t, st); b.m.material.userData.u.uReveal.value = rv; b.m.material.emissiveIntensity = gi * (b.type ? .9 : 1.2);
  }
  // tower build / unbuild
  const up = eio(seg(t, 14.6, 17.4)), down = eio(seg(t, 18.6, 19.4)), h = -.7 + (TH + .9) * up * (1 - down);
  clip.constant = h; tower.visible = up > 0 && down < 1;
  seam.visible = tower.visible && (up < 1 || down > 0); seam.position.set(0, h, 0); seam.material.opacity = .55;
  const spin = t < 17.4 ? (t - 14) * 9 : 0, ang = 2 * Math.PI * (10 / 12) + spin, mang = 2 * Math.PI * (9 / 60) + spin * 12;
  for (const [hm, hh] of hands) { hm.rotation.z = -mang; hh.rotation.z = -ang; }
  rings.forEach((m, k) => { const p = seg(t, 17.0 + k * .3, 18.6 + k * .3); m.visible = p > 0 && p < 1; m.position.set(0, -.6 + 10.2 * TS, 0); m.scale.setScalar(1 + p * 14); m.material.opacity = (1 - p) * .9; });
  // lens core
  const cpop = eout(seg(t, 26.2, 27.0)) * (1 - seg(t, 29.8, 30.4)); core.visible = coreGlint.visible = cpop > 0; core.scale.setScalar(Math.max(.001, cpop)); coreGlint.scale.setScalar(Math.max(.001, cpop));
  core.material.emissiveIntensity = .25 + .2 * Math.sin(t * 4); coreGlint.rotation.z = t * .8; coreGlint.material.opacity = .6 * cpop;
  // plate
  const pin = eio(seg(t, 30.6, 32.0)); plate.visible = pin > 0; plate.position.set(0, 5.3, lerp(-1.6, .35, pin)); plate.rotation.y = (1 - pin) * .5;
  plateMat.userData.u.uReveal.value = seg(t, 31.6, 33.4) * 1.15; plateMat.emissiveIntensity = 1.6 + .25 * Math.sin(t * 2.2);
  // dust
  for (let i = 0; i < DUST; i++) { const s = dseed[i]; dpos[i * 3] = s[0] + Math.sin(t * .2 + s[3] * 9) * .6; dpos[i * 3 + 1] = s[1] + ((t * .12 * (.4 + s[4])) % 3) - 1.5 + Math.sin(t * .3 + s[4] * 7) * .3; dpos[i * 3 + 2] = s[2]; }
  dg.attributes.position.needsUpdate = true;
  composer.render(); overlay(t);
}

  buildPlate(LOGO);
