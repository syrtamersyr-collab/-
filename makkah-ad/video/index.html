<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>خيط الضوء — مركز مكة</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{margin:0;background:#000}
  canvas{display:block;width:1080px;height:1920px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// «خيط الضوء» — Makkah Technologies wireless-internet reel. 1080x1920, 35s.
// Everything is drawn from render(t), so any frame can be rendered on its own.
const W = 1080, H = 1920, DUR = 35;
const C = {
  navy: '#02376C', green: '#50BE1E', night: '#04152B', cyan: '#5FE3FF',
  white: '#F3F6FA', warm: '#F2B45A'
};
const DISPLAY = '"Readex Pro","IBM Plex Sans Arabic",sans-serif';
const BODY = '"IBM Plex Sans Arabic","Readex Pro",sans-serif';

const cv = document.getElementById('c');
let ctx = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eout = p => 1 - Math.pow(1 - p, 3);
const eoutExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const einExpo = p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10);
const eback = p => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const smooth = p => p * p * (3 - 2 * p);
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
// White curved panel antenna with feed arm, as installed on Homs rooftops.
function panelAntenna(c, x, y, sc = 1, glow = 0) {
  c.save(); c.translate(x, y); c.scale(sc, sc);
  c.strokeStyle = '#7F93AA'; c.lineWidth = 9; c.beginPath(); c.moveTo(14, 30); c.lineTo(14, 170); c.stroke();
  const g = c.createLinearGradient(-80, -60, 80, 60); g.addColorStop(0, '#FFFFFF'); g.addColorStop(.6, '#DCE3EA'); g.addColorStop(1, '#AAB6C3');
  c.fillStyle = g;
  c.beginPath(); c.moveTo(-82, -48); c.quadraticCurveTo(0, -66, 82, -48); c.quadraticCurveTo(70, 0, 82, 48); c.quadraticCurveTo(0, 66, -82, 48); c.quadraticCurveTo(-70, 0, -82, -48); c.closePath(); c.fill();
  c.fillStyle = 'rgba(90,110,130,.45)';
  for (let i = -70; i <= 70; i += 9) for (let j = -44; j <= 44; j += 9) if (Math.abs(i) > 22) { c.beginPath(); c.arc(i, j, 1.4, 0, 7); c.fill(); }
  c.fillStyle = '#F4F7FA'; c.fillRect(-20, -58, 40, 116);
  c.fillStyle = '#EEF2F6'; c.beginPath(); c.moveTo(-10, -6); c.lineTo(-62, 4); c.lineTo(-62, 26); c.lineTo(-10, 14); c.closePath(); c.fill();
  c.fillStyle = '#FFFFFF'; rr(c, -84, -4, 30, 34, 6); c.fill();
  if (glow > 0) { c.globalCompositeOperation = 'lighter'; c.fillStyle = `rgba(80,190,30,${glow})`; c.beginPath(); c.arc(-70, 12, 9, 0, 7); c.fill(); }
  c.restore();
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// Animated Arabic headline: words rise in from the right, one after another.
function words(text, x, y, size, t, tin, tout, o = {}) {
  if (t < tin || t > tout + 0.6) return;
  const font = `${o.weight || 700} ${size}px ${o.font || DISPLAY}`;
  ctx.save();
  ctx.font = font; ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const ws = text.split(' ');
  const sp = ctx.measureText(' ').width;
  const wd = ws.map(w => ctx.measureText(w).width);
  const total = wd.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let cx = x + total / 2;
  const outP = eio(seg(t, tout, tout + 0.45));
  ws.forEach((w, i) => {
    const p = eout(seg(t, tin + i * (o.stagger ?? 0.11), tin + i * (o.stagger ?? 0.11) + 0.5));
    const a = p * (1 - outP);
    if (a > 0.003) {
      ctx.globalAlpha = a;
      ctx.filter = `blur(${((1 - p) * 14 + outP * 10).toFixed(1)}px)`;
      ctx.shadowColor = 'rgba(0,8,20,.55)'; ctx.shadowBlur = 28;
      ctx.fillStyle = (o.colors && o.colors[i]) || o.color || C.white;
      ctx.fillText(w, cx, y + (1 - p) * 46 - outP * 30);
    }
    cx -= wd[i] + sp;
  });
  ctx.restore();
}

// Glowing light thread through a list of points.
function thread(pts, width = 10, alpha = 1, col = C.green) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const path = () => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); };
  ctx.globalAlpha = alpha * 0.35; ctx.strokeStyle = col; ctx.lineWidth = width * 3.2; ctx.shadowColor = col; ctx.shadowBlur = 50; path(); ctx.stroke();
  ctx.globalAlpha = alpha * 0.9; ctx.lineWidth = width; ctx.shadowBlur = 24; path(); ctx.stroke();
  ctx.globalAlpha = alpha; ctx.strokeStyle = '#E9FFD9'; ctx.lineWidth = width * 0.32; ctx.shadowBlur = 0; path(); ctx.stroke();
  ctx.restore();
}
function headGlow(x, y, r = 60, a = 1) {
  ctx.save();
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(235,255,220,${a})`); g.addColorStop(.25, `rgba(120,230,70,${.7 * a})`); g.addColorStop(1, 'rgba(80,190,30,0)');
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  ctx.restore();
}
function flash(a, col = '220,255,200') { if (a <= 0) return; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(${col},${a})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }

// ---------- assets & pre-rendered layers ----------
const IMG = {};
function loadImg(k, src) { return new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.src = src; }); }

let STARS, GRAIN, MAP, MAPLIT, ROOF, VIGN;
const MW = 2600, MH = 3600;           // map canvas size
const NODES = [];                      // coverage nodes on the map

function buildStars() {
  const r = rng(7); STARS = [];
  for (let i = 0; i < 260; i++) STARS.push([r() * W, r() * H * 0.6, r() * 1.8 + .3, r() * 6.28]);
}
function buildGrain() {
  GRAIN = mk(512, 512); const g = GRAIN.getContext('2d'); const d = g.createImageData(512, 512); const r = rng(3);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0);
}
function buildVignette() {
  VIGN = mk(W, H); const g = VIGN.getContext('2d');
  const gr = g.createRadialGradient(W / 2, H * .48, H * .28, W / 2, H * .5, H * .78);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,4,12,.62)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
// Top-down Homs-like city: street grid, blocks, the Orontes to the west.
function buildMap() {
  MAP = mk(MW, MH); MAPLIT = mk(MW, MH);
  const a = MAP.getContext('2d'), b = MAPLIT.getContext('2d');
  a.fillStyle = '#05182C'; a.fillRect(0, 0, MW, MH);
  b.fillStyle = '#0A2A1E'; b.fillRect(0, 0, MW, MH);
  const r = rng(11);
  const ang = -0.18, cs = Math.cos(ang), sn = Math.sin(ang);
  const river = y => 360 + 140 * Math.sin(y / 520) + 60 * Math.sin(y / 190);
  for (let gy = -400; gy < MH + 400; gy += 120) {
    for (let gx = -400; gx < MW + 400; gx += 120) {
      if (r() < 0.06) continue;
      const w = 70 + r() * 40, h = 70 + r() * 40;
      const x0 = gx + r() * 12, y0 = gy + r() * 12;
      const X = MW / 2 + (x0 - MW / 2) * cs - (y0 - MH / 2) * sn, Y = MH / 2 + (x0 - MW / 2) * sn + (y0 - MH / 2) * cs;
      if (X < river(Y) + 70 && X > river(Y) - 230) continue;
      for (const [c, lit] of [[a, 0], [b, 1]]) {
        c.save(); c.translate(X, Y); c.rotate(ang);
        c.fillStyle = lit ? `hsl(${100 + r() * 30},${45 + r() * 15}%,${16 + r() * 8}%)` : `hsl(212,${45 + r() * 10}%,${11 + r() * 5}%)`;
        rr(c, 0, 0, w, h, 6); c.fill();
        if (lit) {
          for (let k = 0; k < 6; k++) { c.fillStyle = r() < .5 ? 'rgba(255,214,140,.9)' : 'rgba(190,255,150,.85)'; c.fillRect(6 + r() * (w - 12), 6 + r() * (h - 12), 3, 3); }
        } else {
          for (let k = 0; k < 2; k++) { c.fillStyle = 'rgba(255,200,120,.35)'; c.fillRect(6 + r() * (w - 12), 6 + r() * (h - 12), 2.5, 2.5); }
        }
        c.restore();
      }
    }
  }
  // avenues
  const av = (c, col, w) => {
    c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round';
    for (let i = 0; i < 7; i++) {
      c.beginPath(); const y = 300 + i * 500; c.moveTo(0, y); c.bezierCurveTo(MW * .3, y - 120, MW * .7, y + 140, MW, y - 40); c.stroke();
    }
    for (let i = 0; i < 5; i++) {
      c.beginPath(); const x = 700 + i * 470; c.moveTo(x, 0); c.bezierCurveTo(x + 120, MH * .3, x - 140, MH * .7, x + 60, MH); c.stroke();
    }
  };
  av(a, '#123A60', 14); av(b, 'rgba(140,255,90,.55)', 6);
  // river
  for (const [c, lit] of [[a, 0], [b, 1]]) {
    c.beginPath(); c.moveTo(river(0) - 90, 0);
    for (let y = 0; y <= MH; y += 20) c.lineTo(river(y) - 90 + 18 * Math.sin(y / 90), y);
    for (let y = MH; y >= 0; y -= 20) c.lineTo(river(y) + 10 + 14 * Math.sin(y / 70), y);
    c.closePath(); c.fillStyle = lit ? '#0E5A6E' : '#0B2F4C'; c.fill();
    c.strokeStyle = lit ? 'rgba(95,227,255,.7)' : 'rgba(95,227,255,.18)'; c.lineWidth = 3; c.stroke();
  }
  // coverage nodes (Al-Qusour at the centre)
  const cx = MW / 2, cy = MH / 2;
  // Homs neighbourhoods around Al-Qusour (angle: 0 = east, clockwise; rough real-world bearings)
  const main = [['الخالدية', -1.6, 560], ['البياضة', -0.85, 640], ['الزهراء', 0.05, 620], ['عكرمة', 0.85, 640],
                ['باب السباع', 1.6, 580], ['الإنشاءات', 2.35, 620], ['الغوطة', 3.05, 560], ['الوعر', 3.55, 800]];
  main.forEach(([name, an, d], i) => NODES.push({ name, x: cx + Math.cos(an) * d, y: cy + Math.sin(an) * d * 1.15, t: 17.0 + i * 0.6, big: 1 }));
  const r2 = rng(5);
  for (let i = 0; i < 14; i++) { const an = r2() * 6.28, d = 820 + r2() * 520; NODES.push({ x: cx + Math.cos(an) * d, y: cy + Math.sin(an) * d * 1.2, t: 21.6 + i * 0.2, big: 0 }); }
}
// Rooftop strip used in the flyover (water tanks + dishes, very Homs).
function buildRoofs() {
  ROOF = mk(4200, 520); const g = ROOF.getContext('2d'); const r = rng(21);
  let x = 0;
  while (x < 4200) {
    const w = 160 + r() * 220, h = 160 + r() * 260, y = 520 - h;
    g.fillStyle = `hsl(214,40%,${7 + r() * 4}%)`; g.fillRect(x, y, w, h);
    g.fillStyle = '#0E2A48'; g.fillRect(x, y, w, 8);
    for (let k = 0; k < (r() * 3 | 0) + 1; k++) { // water tanks
      const tx = x + 15 + r() * (w - 60), tw = 34 + r() * 16;
      g.fillStyle = '#163A5E'; rr(g, tx, y - 40, tw, 40, 6); g.fill();
      g.fillStyle = '#0B2140'; g.fillRect(tx + 4, y - 44, tw - 8, 6);
    }
    if (r() < .55) { // dish antenna
      const dx = x + w * (.3 + r() * .5);
      g.save(); g.globalAlpha = .55; panelAntenna(g, dx, y - 64, 0.34); g.restore();
    }
    for (let k = 0; k < 10; k++) if (r() < .4) { g.fillStyle = r() < .7 ? 'rgba(255,196,110,.85)' : 'rgba(200,230,255,.5)'; g.fillRect(x + 12 + r() * (w - 30), y + 30 + r() * (h - 60), 12, 16); }
    x += w + 4;
  }
}

// ---------- shared pieces ----------
function sky(top = '#030E1E', bot = '#0B2A4F', tw = 0) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.fillStyle = '#fff';
  for (const [x, y, s, ph] of STARS) { ctx.globalAlpha = .35 + .3 * Math.sin(tw * 2 + ph); ctx.fillRect(x, y, s, s); }
  ctx.restore();
}
function moon(x, y, r) {
  ctx.save();
  const g = ctx.createRadialGradient(x, y, r * .6, x, y, r * 4); g.addColorStop(0, 'rgba(220,235,255,.25)'); g.addColorStop(1, 'rgba(220,235,255,0)');
  ctx.fillStyle = g; ctx.fillRect(x - r * 4, y - r * 4, r * 8, r * 8);
  ctx.beginPath(); ctx.rect(x - r * 5, y - r * 5, r * 10, r * 10); ctx.arc(x + r * .45, y - r * .2, r * .92, 0, 7); ctx.clip('evenodd');
  ctx.fillStyle = '#E8F0FA'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.restore();
}
function skyline(baseY, off, seed, col, hmin, hmax, lights = 0) {
  const r = rng(seed); ctx.save(); ctx.fillStyle = col;
  let x = -((off % 3000) + 3000) % 3000 - 400;
  const bl = [];
  while (x < W + 400) {
    const w = 60 + r() * 140, h = hmin + r() * (hmax - hmin);
    ctx.fillRect(x, baseY - h, w + 2, h + 2000);
    if (lights) for (let k = 0; k < 6; k++) if (r() < lights) bl.push([x + 8 + r() * (w - 20), baseY - h + 15 + r() * (h - 30)]);
    if (r() < .12) { ctx.fillRect(x + w / 2 - 6, baseY - h - 120, 12, 120); ctx.beginPath(); ctx.moveTo(x + w / 2 - 9, baseY - h - 120); ctx.lineTo(x + w / 2, baseY - h - 160); ctx.lineTo(x + w / 2 + 9, baseY - h - 120); ctx.fill(); }
    x += w;
  }
  ctx.fillStyle = 'rgba(255,200,120,.8)'; for (const [a, b] of bl) ctx.fillRect(a, b, 6, 8);
  ctx.restore();
}

// ================= SCENE 1 — frozen living room (0–5s) =================
function scene1(t) {
  const p = eio(seg(t, 0, 4.3));
  const dive = einExpo(seg(t, 4.25, 5.0));
  const LED = [925, 712];
  const z = lerp(1.0 + 0.075 * p, 7, dive);
  const fx = lerp(lerp(540, 600, p), LED[0], dive), fy = lerp(1060, LED[1], dive);
  ctx.save();
  ctx.translate(W / 2, H * .5); ctx.scale(z, z); ctx.translate(-fx, -fy);

  const layer = (k, fn) => { ctx.save(); ctx.translate(k * p, 0); fn(); ctx.restore(); };

  // wall
  const wg = ctx.createLinearGradient(0, -200, 0, H); wg.addColorStop(0, '#0C1F35'); wg.addColorStop(1, '#172B3F');
  ctx.fillStyle = wg; ctx.fillRect(-600, -600, W + 1200, H + 1200);
  // warm lamp spill
  const lg = ctx.createRadialGradient(120, 980, 20, 120, 980, 620); lg.addColorStop(0, 'rgba(242,180,90,.32)'); lg.addColorStop(1, 'rgba(242,180,90,0)');
  ctx.fillStyle = lg; ctx.fillRect(-600, 300, 1400, 1400);

  // window with night Homs
  layer(55, () => {
    ctx.save(); rr(ctx, 300, 280, 480, 700, 10); ctx.clip();
    const sg = ctx.createLinearGradient(0, 280, 0, 980); sg.addColorStop(0, '#04122A'); sg.addColorStop(1, '#0E3360'); ctx.fillStyle = sg; ctx.fillRect(300, 280, 480, 700);
    ctx.fillStyle = '#fff'; for (const [x, y, s] of STARS.slice(0, 60)) ctx.fillRect(300 + x * .44, 280 + y * .5, s, s);
    moon(670, 400, 26);
    ctx.save(); ctx.translate(0, 0); skyline(980, 0, 31, '#071A33', 60, 210, .25); ctx.restore();
    ctx.restore();
  });
  // window frame + curtains
  layer(30, () => {
    ctx.strokeStyle = '#081322'; ctx.lineWidth = 22; rr(ctx, 300, 280, 480, 700, 10); ctx.stroke();
    ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(540, 280); ctx.lineTo(540, 980); ctx.moveTo(300, 600); ctx.lineTo(780, 600); ctx.stroke();
    for (const [x0, dir] of [[210, 1], [870, -1]]) {
      for (let i = 0; i < 6; i++) {
        const g = ctx.createLinearGradient(x0 + i * 20 * dir, 0, x0 + (i + 1) * 20 * dir, 0);
        g.addColorStop(0, '#1A3654'); g.addColorStop(.5, '#24476B'); g.addColorStop(1, '#152C47');
        ctx.fillStyle = g; ctx.fillRect(dir > 0 ? x0 + i * 20 : x0 - (i + 1) * 20, 230, 20, 900);
      }
    }
    ctx.fillStyle = '#0A1626'; ctx.fillRect(170, 222, 740, 16);
    // wall clock, frozen
    const cx = 120, cy = 430;
    ctx.fillStyle = '#0A1626'; ctx.beginPath(); ctx.arc(cx, cy, 84, 0, 7); ctx.fill();
    ctx.fillStyle = '#E3E9F1'; ctx.beginPath(); ctx.arc(cx, cy, 72, 0, 7); ctx.fill();
    ctx.strokeStyle = '#2A3A50'; ctx.lineWidth = 4;
    for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 58, cy + Math.sin(a) * 58); ctx.lineTo(cx + Math.cos(a) * 66, cy + Math.sin(a) * 66); ctx.stroke(); }
    const hand = (a, l, w, c) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a - Math.PI / 2) * l, cy + Math.sin(a - Math.PI / 2) * l); ctx.stroke(); };
    hand(10.15 / 12 * 6.283, 36, 7, '#0B1F38'); hand(8 / 60 * 6.283, 54, 5, '#0B1F38'); hand(37 / 60 * 6.283 + Math.sin(t * 40) * .004, 60, 2.5, '#D9412B');
  });

  // shelf + router (the router stays alive)
  layer(30, () => {
    ctx.fillStyle = '#4A3322'; ctx.fillRect(820, 768, 230, 18);
    ctx.fillStyle = '#0E2036'; rr(ctx, 860, 700, 140, 68, 12); ctx.fill();
    ctx.strokeStyle = '#1B3B60'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = '#0E2036'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(880, 704); ctx.lineTo(866, 610); ctx.moveTo(980, 704); ctx.lineTo(994, 610); ctx.stroke();
  });
  // sofa
  layer(0, () => {
    ctx.fillStyle = '#1C3350'; rr(ctx, -40, 1040, 1160, 360, 60); ctx.fill();
    ctx.fillStyle = '#213D5F'; rr(ctx, 60, 1080, 420, 240, 40); ctx.fill(); rr(ctx, 600, 1080, 420, 240, 40); ctx.fill();
    ctx.fillStyle = '#0B1828'; ctx.fillRect(-600, 1520, W + 1200, 1000);
    // rug
    ctx.fillStyle = '#3A1E22'; ctx.beginPath(); ctx.ellipse(540, 1700, 640, 140, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#6E3A2E'; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(540, 1700, 590, 118, 0, 0, 7); ctx.stroke();
  });

  // foreground: table, mate, kettle, ball, phone
  layer(-45, () => {
    // ball frozen mid-air with motion arcs
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(330, 1340, 190 + i * 18, Math.PI * 1.05, Math.PI * 1.32); ctx.stroke(); }
    ctx.restore();
    const bx = 165, by = 1170 + Math.sin(t * 1.3) * 1.5;
    ctx.fillStyle = '#E8ECF2'; ctx.beginPath(); ctx.arc(bx, by, 58, 0, 7); ctx.fill();
    ctx.fillStyle = '#D23B2E'; ctx.beginPath(); ctx.arc(bx, by, 58, -0.9, 0.6); ctx.lineTo(bx, by); ctx.fill();
    ctx.beginPath(); ctx.arc(bx, by, 58, 2.2, 3.4); ctx.lineTo(bx, by); ctx.fill();
    const bg = ctx.createRadialGradient(bx - 20, by - 22, 4, bx, by, 60); bg.addColorStop(0, 'rgba(255,255,255,.5)'); bg.addColorStop(1, 'rgba(0,0,0,.25)'); ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(bx, by, 58, 0, 7); ctx.fill();

    // table
    ctx.fillStyle = '#3B2618'; ctx.fillRect(170, 1440, 34, 160); ctx.fillRect(880, 1440, 34, 160);
    const tg = ctx.createLinearGradient(0, 1390, 0, 1450); tg.addColorStop(0, '#8A5F3E'); tg.addColorStop(1, '#5A3A25');
    ctx.fillStyle = tg; rr(ctx, 110, 1390, 860, 58, 14); ctx.fill();

    // copper rakweh (coffee pot) held just out of frame, pouring
    ctx.save(); ctx.translate(834, 1068); ctx.rotate(-0.6);

  const [px, py] = toScreen(MW / 2, MH / 2, cam);
  const pinA = seg(t, 15.3, 15.8) * fade;
  if (pinA > 0) {
    ctx.save(); ctx.globalAlpha = pinA;
    const pulse = (t * 1.2) % 1;
    ctx.strokeStyle = `rgba(80,190,30,${1 - pulse})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(px, py, 20 + pulse * 70, 0, 7); ctx.stroke();
    ctx.fillStyle = C.green; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(px, py - 70, 34, Math.PI * .8, Math.PI * .2); ctx.lineTo(px, py - 8); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px, py - 72, 13, 0, 7); ctx.fill();
    ctx.font = `700 46px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.direction = 'rtl'; ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 16; ctx.fillText('القصور', px, py + 60);
    ctx.restore();
  }
  for (const n of NODES) {
    if (!n.name) continue;
    const a = eout(seg(t, n.t + .05, n.t + .45)) * fade;
    if (a <= 0) continue;
    const [sx, sy] = toScreen(n.x, n.y, cam);
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = `700 44px ${DISPLAY}`; ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(n.name).width + 44;
    const x = clamp(sx, w / 2 + 24, W - w / 2 - 24), y = sy - 58 + (1 - a) * 18;
    ctx.fillStyle = 'rgba(2,20,40,.78)'; rr(ctx, x - w / 2, y - 34, w, 68, 34); ctx.fill();
    ctx.strokeStyle = 'rgba(80,190,30,.9)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillText(n.name, x, y + 2);
    ctx.restore();
  }
  { const a = seg(t, 15.8, 16.4) * (t < 25 ? 1 : 1 - seg(t, 25, 25.5));
    ctx.save(); ctx.globalAlpha = a; const g = ctx.createLinearGradient(0, 180, 0, 640); g.addColorStop(0, 'rgba(2,12,26,0)'); g.addColorStop(.45, 'rgba(2,12,26,.82)'); g.addColorStop(1, 'rgba(2,12,26,0)'); ctx.fillStyle = g; ctx.fillRect(0, 180, W, 460); ctx.restore(); }
  words('تغطية بتوصل لحارتك', W / 2, 380, 86, t, 16.2, 22.4);
  words('سرعة ما بتوقف', W / 2, 380, 112, t, 22.7, 24.6, { color: C.green });
}
// dome path in screen space (logo-like ogee dome)
function domePath(cx, by, w, h) {
  return [[cx - w / 2, by], [cx - w / 2, by - h * .35, cx - w * .32, by - h * .92, cx, by - h], [cx + w * .32, by - h * .92, cx + w / 2, by - h * .35, cx + w / 2, by]];
}
function sampleDome(cx, by, w, h, n) {
  const [p0, c1, c2] = domePath(cx, by, w, h); const pts = [];
  const bez = (a, b, c, d, q) => (1 - q) ** 3 * a + 3 * (1 - q) ** 2 * q * b + 3 * (1 - q) * q * q * c + q ** 3 * d;
  for (let i = 0; i <= n; i++) { const q = i / n; pts.push([bez(p0[0], c1[0], c1[2], c1[4], q), bez(p0[1], c1[1], c1[3], c1[5], q)]); }
  for (let i = 1; i <= n; i++) { const q = i / n; pts.push([bez(c1[4], c2[0], c2[2], c2[4], q), bez(c1[5], c2[1], c2[3], c2[5], q)]); }
  return pts;
}
function scene5(t) {
  const u = t - 25;
  const mapFade = 1 - eio(seg(u, 0.2, 1.4));
  scene4(t, mapFade);
  // dark glow ground
  ctx.save(); ctx.globalAlpha = 1 - mapFade;
  const bg = ctx.createRadialGradient(W / 2, 800, 50, W / 2, 900, 1100); bg.addColorStop(0, '#0B3A3A'); bg.addColorStop(.45, '#04203E'); bg.addColorStop(1, '#020A16');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H); ctx.restore();
  const cam = mapCam(t);
  const CX = 540, BY = 900, DW = 470, DH = 300;
  // threads converge from nodes to the dome base
  const cv1 = eio(seg(u, 0, 1.0));
  if (cv1 > 0 && u < 1.35) {
    const sel = NODES.filter(n => n.big);
    sel.forEach((n, i) => {
      const [sx, sy] = toScreen(n.x, n.y, cam);
      const tx = CX + (i - 3.5) * 20, ty = BY - 40;
      const pts = []; const k = Math.round(30 * cv1);
      for (let j = 0; j <= k; j++) { const q = j / 30; pts.push([lerp(sx, tx, q), lerp(sy, ty, q) - Math.sin(q * Math.PI) * 180]); }
      thread(pts, 6, 1 - seg(u, 1.0, 1.35));
    });
  }
  // dome drawn by the light
  const dp = eio(seg(u, 0.95, 1.75));
  const vecA = 1 - eio(seg(u, 2.45, 2.9));
  if (dp > 0 && vecA > 0) {
    ctx.save(); ctx.globalAlpha = vecA;
    const pts = sampleDome(CX, BY, DW, DH, 60); const k = Math.max(2, Math.round(pts.length * dp));
    // fill grows in
    const fp = seg(u, 1.6, 1.95);
    if (fp > 0) {
      ctx.save(); ctx.globalAlpha = fp; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
      const g = ctx.createLinearGradient(0, BY - DH, 0, BY); g.addColorStop(0, '#7BE04A'); g.addColorStop(1, '#3E9F14'); ctx.fillStyle = g; ctx.shadowColor = C.green; ctx.shadowBlur = 60; ctx.fill(); ctx.restore();
    }
    // draw from both ends toward the top, like the logo is being built
    const half = Math.floor(pts.length / 2);
    const a = pts.slice(0, Math.max(2, Math.round(half * dp) + 1)), b = pts.slice(pts.length - Math.max(2, Math.round(half * dp) + 1)).reverse();
    thread(a, 9, 1 - fp * .6); thread(b, 9, 1 - fp * .6);
    // roof band under the dome
    const rp = eout(seg(u, 1.7, 2.1));
    if (rp > 0) {
      ctx.save(); ctx.fillStyle = C.white; ctx.globalAlpha = rp;
      const w2 = (DW / 2 + 30) * rp;
      ctx.beginPath(); ctx.moveTo(CX - w2, BY + 30); ctx.lineTo(CX, BY + 6); ctx.lineTo(CX + w2, BY + 30); ctx.lineTo(CX + w2, BY + 50); ctx.lineTo(CX, BY + 26); ctx.lineTo(CX - w2, BY + 50); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    // finial + crescent — the hit
    const cp = seg(u, 1.95, 2.05);
    if (cp > 0) {
      ctx.save(); ctx.fillStyle = C.green; ctx.shadowColor = '#B6FF8A'; ctx.shadowBlur = 40 + 60 * (1 - seg(u, 2.0, 2.8));
      ctx.fillRect(CX - 5, BY - DH - 60, 10, 62);
      ctx.beginPath(); ctx.arc(CX, BY - DH - 70, 14, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(CX + 22, BY - DH - 146, 38, 0, 7); ctx.clip('evenodd');
      ctx.beginPath(); ctx.arc(CX + 4, BY - DH - 128, 42, 0, 7); ctx.fill();
      ctx.restore();
      const sw = seg(u, 2.0, 2.9);
      ctx.save(); ctx.strokeStyle = `rgba(190,255,150,${(1 - sw) * .9})`; ctx.lineWidth = 10 * (1 - sw) + 1; ctx.beginPath(); ctx.arc(CX, BY - 150, 60 + sw * 900, 0, 7); ctx.stroke(); ctx.restore();
    }
    ctx.restore();
  }
  flash((1 - seg(u, 2.0, 2.45)) * seg(u, 1.97, 2.0) * .8);
  // swap to the real logo
  const lg = eio(seg(u, 2.45, 3.05));
  if (lg > 0) {
    const s = lerp(.86, 1, eout(lg)), R = 300 * s;
    ctx.save(); ctx.globalAlpha = lg;
    const gg = ctx.createRadialGradient(CX, 760, R * .8, CX, 760, R * 1.7); gg.addColorStop(0, 'rgba(80,190,30,.35)'); gg.addColorStop(1, 'rgba(80,190,30,0)');
    ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(CX, 760, R * .99, 0, 7); ctx.fill();
    ctx.drawImage(IMG.logo, CX - R, 760 - R, 2 * R, 2 * R);
    ctx.restore();
  }
  words('كل شي بيوقف…', W / 2, 1220, 98, t, 27.55, 29.6);
  words('إلا سرعتك', W / 2, 1360, 132, t, 28.1, 29.6, { color: C.green, stagger: .2 });
  flash(einExpo(seg(u, 4.65, 5.0)) * .9);
}

// ================= SCENE 6 — card + numbers, loops back (30–35s) =================
let FIRST = null;
function scene6(t) {
  const u = t - 30;
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#022B57'); bg.addColorStop(1, '#011A36');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // light streaks
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++) { const y = ((i * 340 + u * 160) % 2400) - 300; const g = ctx.createLinearGradient(0, y, W, y - 500); g.addColorStop(0, 'rgba(80,190,30,0)'); g.addColorStop(.5, 'rgba(80,190,30,.10)'); g.addColorStop(1, 'rgba(80,190,30,0)'); ctx.strokeStyle = g; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y - 500); ctx.stroke(); }
  const pr = rng(4); for (let i = 0; i < 60; i++) { ctx.fillStyle = `rgba(180,255,140,${pr() * .4})`; ctx.beginPath(); ctx.arc(pr() * W, (pr() * H - u * 30 * (pr() + .3) + H) % H, pr() * 2.5 + .5, 0, 7); ctx.fill(); }
  ctx.restore();

  words('إنترنت هوائي · سرعة وتغطية', W / 2, 380, 62, t, 30.35, 34.2, { stagger: .08 });

  // card spin-in
  const sp = eout(seg(u, 0, 1.35));
  const ang = lerp(Math.PI * 1.15, 0, sp) + Math.sin(u * 1.4) * .04 * sp;
  const cw = 900, ch = cw * IMG.card.height / IMG.card.width;
  const cy = lerp(1150, 790, sp) + Math.sin(u * 1.8) * 6;
  ctx.save();
  ctx.translate(540, cy);
  // shadow
  ctx.save(); ctx.globalAlpha = .5 * sp; ctx.fillStyle = '#000'; ctx.filter = 'blur(30px)'; ctx.beginPath(); ctx.ellipse(0, ch / 2 + 70, cw * .42 * Math.abs(Math.cos(ang)) + 40, 26, 0, 0, 7); ctx.fill(); ctx.restore();
  const sx = Math.cos(ang), sk = Math.sin(ang) * .14;
  ctx.transform(sx, sk, 0, 1, 0, 0);
  ctx.globalAlpha = seg(u, 0, .25);
  ctx.save(); rr(ctx, -cw / 2, -ch / 2, cw, ch, 22); ctx.clip();
  if (sx >= 0) ctx.drawImage(IMG.card, -cw / 2, -ch / 2, cw, ch);
  else { ctx.fillStyle = C.navy; ctx.fillRect(-cw / 2, -ch / 2, cw, ch); ctx.save(); ctx.scale(-1, 1); ctx.drawImage(IMG.logo, -170, -170, 340, 340); ctx.restore(); }
  // sheen sweep
  const sh = seg(u, 1.35, 2.05);
  if (sh > 0 && sh < 1) { const x = lerp(-cw, cw, sh); const g = ctx.createLinearGradient(x - 160, -ch / 2, x + 160, ch / 2); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(-cw / 2, -ch / 2, cw, ch); }
  ctx.restore();
  ctx.restore();

  // phone numbers
  const pill = (y, num, ti) => {
    const p = eback(seg(u, ti, ti + .5)); if (p <= 0) return;
    ctx.save(); ctx.globalAlpha = clamp(p); ctx.translate(540, y); ctx.scale(lerp(.8, 1, p), lerp(.8, 1, p));
    ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 30; rr(ctx, -330, -52, 660, 104, 52); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = C.green; ctx.beginPath(); ctx.arc(-260, 0, 36, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(-260, 0, 16, Math.PI * .6, Math.PI * 1.45); ctx.stroke();
    ctx.fillStyle = C.navy; ctx.font = `700 62px ${BODY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'ltr';
    ctx.fillText(num, 40, 4);
    ctx.restore();
  };
  pill(1200, '0982 621 531', 1.45);
  pill(1330, '0986 955 402', 1.65);
  words('حمص · القصور · خلف جامع حمود الناصر', W / 2, 1450, 44, t, 32.0, 34.2, { weight: 500, font: BODY, stagger: .05 });

  // loop back into the opening frame
  const lp = eio(seg(u, 4.35, 5.0));
  if (lp > 0) {
    ctx.save(); ctx.globalAlpha = lp; const z = lerp(1.25, 1, lp); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.drawImage(FIRST, -W / 2, -H / 2); ctx.restore();
  }
}

// ---------- timeline ----------
function drawScene(t) {
  if (t < 5) scene1(t);
  else if (t < 8) scene2(t);
  else if (t < 15) { scene3(t); if (t > 14.6) { ctx.save(); ctx.globalAlpha = seg(t, 14.6, 15); scene4(15); ctx.restore(); } }
  else if (t < 25) scene4(t);
  else if (t < 30) scene5(t);
  else scene6(t);
}
function post(t) {
  ctx.drawImage(VIGN, 0, 0);
  ctx.save(); ctx.globalAlpha = .07; ctx.globalCompositeOperation = 'overlay';
  const r = rng(Math.floor(t * 30) + 1); const ox = -r() * 512, oy = -r() * 512;
  for (let x = ox; x < W; x += 512) for (let y = oy; y < H; y += 512) ctx.drawImage(GRAIN, x, y);
  ctx.restore();
}
function render(t) {
  ctx.save(); ctx.clearRect(0, 0, W, H); drawScene(t); post(t); ctx.restore();
}

window.ready = (async () => {
  await Promise.all([loadImg('logo', 'assets/logo.webp'), loadImg('card', 'assets/card.webp')]);
  await Promise.all([
    document.fonts.load(`700 80px "Readex Pro"`, 'مكة'),
    document.fonts.load(`700 60px "IBM Plex Sans Arabic"`, 'مكة 0982'),
    document.fonts.load(`500 40px "IBM Plex Sans Arabic"`, 'حمص'),
  ]);
  buildStars(); buildGrain(); buildVignette(); buildMap(); buildRoofs();
  // pre-render the opening frame for the seamless loop
  FIRST = mk(W, H); const real = ctx; ctx = FIRST.getContext('2d'); render(0); ctx = real;
  return true;
})();
window.render = render;
